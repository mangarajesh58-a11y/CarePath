name: Build CarePath Mobile Apps

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Patient Android APK
        working-directory: ./android-patient
        run: |
          set +e
          echo "### Patient Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          npm install 2>&1 | tee -a /tmp/patient.log
          npx cap sync android 2>&1 | tee -a /tmp/patient.log
          cd android
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a /tmp/patient.log
          EXIT_CODE=$?
          cat /tmp/patient.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Build Hospital Android APK
        working-directory: ./android-hospital
        run: |
          set +e
          echo "### Hospital Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          npm install 2>&1 | tee -a /tmp/hospital.log
          npx cap sync android 2>&1 | tee -a /tmp/hospital.log
          cd android
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a /tmp/hospital.log
          EXIT_CODE=$?
          cat /tmp/hospital.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Build Admin Android APK
        working-directory: ./android-admin
        run: |
          set +e
          echo "### Admin Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          npm install 2>&1 | tee -a /tmp/admin.log
          npx cap sync android 2>&1 | tee -a /tmp/admin.log
          cd android
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a /tmp/admin.log
          EXIT_CODE=$?
          cat /tmp/admin.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: carepath-android-apks
          path: |
            android-patient/android/app/build/outputs/apk/debug/app-debug.apk
            android-hospital/android/app/build/outputs/apk/debug/app-debug.apk
            android-admin/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Apps
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Patient iOS App
        working-directory: ./android-patient
        run: |
          set +e
          echo "### iOS Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          npm install 2>&1 | tee -a /tmp/ios.log
          npx cap sync ios 2>&1 | tee -a /tmp/ios.log
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -target App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee -a /tmp/ios.log
          EXIT_CODE=$?
          cat /tmp/ios.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
