<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071329">
  <meta name="color-scheme" content="dark">
  <title>CarePath - Available Doctors & OPD Specialists</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --page: #071329;
      --panel: #0d1a33;
      --card: #111a33;
      --card-soft: #0e172e;
      --line: #1e293b;
      --muted: #94a3bd;
      --text: #f8fafc;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --gold: #f59e0b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: #071329;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 88px);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: #071329;
    }

    /* =========================================
       STICKY TOPBAR
       ========================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 19, 41, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.9);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .btn-back-circle {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #111a30;
      border: 1px solid #1e293b;
      color: #38bdf8;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-back-circle:hover, .btn-back-circle:active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }

    .topbar-title-box {
      min-width: 0;
    }

    .topbar-title-box h1 {
      margin: 0;
      font-size: 15.5px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status-badge-live {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-gps-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-gps-pill:hover, .btn-gps-pill:active {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
    }

    /* Page Content */
    .page-content {
      padding: 14px 14px 28px;
    }

    /* =========================================
       HERO BANNER & LOCATION STRIP
       ========================================= */
    .doctor-hero-banner {
      background: linear-gradient(135deg, #101b33 0%, #152449 100%);
      border: 1px solid rgba(38, 52, 81, 0.9);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hero-title-group h2 {
      font-size: 19px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.3px;
      margin: 0;
      line-height: 1.25;
    }

    .hero-title-group p {
      font-size: 11.5px;
      color: #94a3bd;
      margin-top: 3px;
    }

    .hero-doctor-count {
      padding: 5px 10px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .location-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(9, 17, 34, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      cursor: pointer;
      transition: all 0.2s;
    }

    .location-strip:hover, .location-strip:active {
      border-color: #34d399;
      background: rgba(16, 185, 129, 0.1);
    }

    .loc-strip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .loc-strip-pin {
      font-size: 15px;
      flex-shrink: 0;
    }

    .loc-strip-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .loc-title-text {
      font-size: 12px;
      font-weight: 800;
      color: #f8fafc;
    }

    .loc-sub-text {
      font-size: 10.5px;
      color: #94a3bd;
    }

    .loc-action-btn {
      padding: 4px 9px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      color: #38bdf8;
      font-size: 10.5px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* =========================================
       SEARCH BOX & FILTERS
       ========================================= */
    .search-panel {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .search-panel input {
      width: 100%;
      height: 44px;
      background: #0d172a;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 0 40px 0 40px;
      color: #f8fafc;
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s;
    }

    .search-panel input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }

    .search-panel .search-icon {
      position: absolute;
      left: 14px;
      font-size: 15px;
      color: #64748b;
      pointer-events: none;
    }

    .search-panel .clear-search {
      position: absolute;
      right: 12px;
      background: rgba(30, 41, 59, 0.8);
      border: none;
      color: #94a3bd;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    /* Horizontal Hospital Tabs */
    .hospital-scroll-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .hospital-scroll-row::-webkit-scrollbar { display: none; }

    .hosp-tab-btn {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid #1e293b;
      background: #0e172e;
      color: #94a3bd;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .hosp-tab-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* Department Chips Row */
    .dept-scroll-row {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .dept-scroll-row::-webkit-scrollbar { display: none; }

    .dept-chip-btn {
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(38, 52, 81, 0.7);
      background: #111a30;
      color: #94a3bd;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .dept-chip-btn.active {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.5);
    }

    /* =========================================
       DOCTOR CARDS GRID (PROFESSIONAL MEDICAL UI)
       ========================================= */
    .doctors-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 600px) {
      .doctors-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .doctor-card {
      background: linear-gradient(135deg, #101a33 0%, #132247 100%);
      border: 1px solid rgba(38, 52, 81, 0.85);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 13px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .doctor-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    /* Top Row: Avatar & Metadata */
    .doc-top-profile {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .doc-avatar-wrap {
      width: 58px;
      height: 58px;
      min-width: 58px;
      min-height: 58px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: #1e293b;
      border: 2px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .doc-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      aspect-ratio: 1 / 1;
      display: block;
      border-radius: 14px;
    }

    .doc-verified-check {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 17px;
      height: 17px;
      background: #10b981;
      border: 2px solid #071329;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      color: white;
      font-weight: 900;
    }

    .doc-primary-info {
      flex: 1;
      min-width: 0;
    }

    .doc-name-title {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.2px;
      line-height: 1.25;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-dept-badge {
      font-size: 11.5px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .doc-stats-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .rating-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .exp-pill {
      font-size: 10.5px;
      font-weight: 700;
      color: #cbd5e1;
      background: #1e293b;
      padding: 1px 6px;
      border-radius: 6px;
    }

    /* Hospital & Distance Box */
    .doc-hospital-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(9, 17, 34, 0.8);
      border: 1px solid rgba(38, 52, 81, 0.7);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11.5px;
    }

    .doc-hosp-name-text {
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .doc-dist-badge {
      font-size: 10px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Consultation Spec Details Grid */
    .doc-spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      background: #0d172e;
      border-radius: 12px;
      padding: 9px 11px;
      border: 1px solid rgba(38, 52, 81, 0.6);
      font-size: 11px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .spec-label {
      color: #64748b;
      font-weight: 600;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .spec-val {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer Action Area */
    .doc-footer-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 2px;
    }

    .doc-status-col {
      display: flex;
      flex-direction: column;
    }

    .doc-live-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
    }

    .tag-available {
      color: #34d399;
    }

    .tag-unavailable {
      color: #f87171;
    }

    .tag-fee {
      font-size: 11px;
      color: #94a3bd;
      font-weight: 600;
    }

    .btn-book-token {
      flex: 1;
      height: 40px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-book-token:hover:not(:disabled) {
      background: #0ea5e9;
      transform: translateY(-1px);
    }

    .btn-book-token:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Empty State */
    .empty-state-box {
      background: #111a33;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 38px 20px;
      text-align: center;
      color: #94a3bd;
      grid-column: 1 / -1;
    }

    .empty-state-box h3 {
      font-size: 17px;
      font-weight: 800;
      color: #f8fafc;
      margin: 10px 0 6px;
    }

    .empty-state-box p {
      font-size: 12.5px;
      line-height: 1.5;
      max-width: 380px;
      margin: 0 auto 16px;
    }

    .btn-reset-filters {
      padding: 8px 16px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      color: #38bdf8;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =====================================================
       NATIVE MOBILE BOTTOM NAVIGATION DOCK
       ===================================================== */
    .mobile-bottom-dock {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 9999 !important;
      background: rgba(10, 20, 42, 0.96) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border-top: 1px solid rgba(34, 50, 84, 0.95) !important;
      padding: 6px 16px calc(env(safe-area-inset-bottom, 0px) + 8px) 16px !important;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.5) !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      max-width: 720px !important;
      margin: 0 auto !important;
    }

    .dock-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 3px !important;
      text-decoration: none !important;
      color: #94a3bd !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      padding: 6px 12px !important;
      border-radius: 12px !important;
      transition: all 0.2s !important;
      min-width: 58px !important;
    }

    .dock-item:active {
      transform: scale(0.92);
    }

    .dock-item.active {
      color: #38bdf8 !important;
    }

    .dock-item.active .dock-icon {
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7));
    }

    .dock-icon {
      font-size: 20px !important;
      line-height: 1 !important;
      display: block !important;
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <!-- Sticky Top Navigation Header -->
    <header class="topbar">
      <div class="topbar-left">
        <a href="dashboard.html" class="btn-back-circle" title="Back to Dashboard">
          ←
        </a>
        <div class="topbar-title-box">
          <h1>OPD Doctors <span class="status-badge-live">Live</span></h1>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" id="btnTopGps" class="btn-gps-pill" onclick="requestDoctorLocation()" title="Detect Nearby Doctors">
          📍 <span id="topGpsText">Detect Location</span>
        </button>
      </div>
    </header>

    <!-- Main Page Content -->
    <main class="page-content">

      <!-- Hero Banner & GPS Location Card -->
      <section class="doctor-hero-banner">
        <div class="hero-heading-row">
          <div class="hero-title-group">
            <h2>Find Your Specialist</h2>
            <p id="activeHospitalSub">Book confirmed OPD token with verified specialists</p>
          </div>
          <span class="hero-doctor-count" id="totalDoctorsCountBadge">4 Doctors</span>
        </div>

        <div class="location-strip" id="docLocationStrip" onclick="requestDoctorLocation()" title="Tap to detect GPS location">
          <div class="loc-strip-left">
            <span class="loc-strip-pin">📍</span>
            <div class="loc-strip-info">
              <span class="loc-title-text" id="docLocTitle">Doctors Nearby You</span>
              <span class="loc-sub-text" id="docLocSub">Allow GPS to sort specialists closest to you</span>
            </div>
          </div>
          <div class="loc-action-btn" id="docLocActionBtn">
            Update 🎯
          </div>
        </div>
      </section>

      <!-- Search Input Panel -->
      <section class="search-panel" aria-label="Search Doctors">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search doctor name, specialty, department..."
          autocomplete="off"
        >
        <button
          type="button"
          id="clearSearch"
          class="clear-search"
          aria-label="Clear search"
          style="display: none;"
          onclick="clearSearchInput()"
        >
          ×
        </button>
      </section>

      <!-- Hospital Filter Tabs (Horizontally Scrollable) -->
      <section class="hospital-scroll-row" id="hospitalFilterTabs" aria-label="Filter by Hospital">
        <!-- Rendered instantly via script -->
      </section>

      <!-- Department Filter Chips (Horizontally Scrollable) -->
      <section class="dept-scroll-row" id="departmentChips" aria-label="Filter by Department">
        <!-- Rendered instantly via script -->
      </section>

      <!-- Doctor Cards Grid -->
      <section class="doctors-grid" id="doctorList" aria-live="polite">
        <!-- Immediately populated in 0 milliseconds -->
      </section>

    </main>

  </div>

  <!-- Native Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation">
    <a href="dashboard.html" class="dock-item">
      <span class="dock-icon">🏥</span>
      <span>Hospitals</span>
    </a>

      resolvePhotoSrc: function(doc) {
        if (!doc) return null;
        const docId = String(doc.id || "");
        const raw = String(doc.image_url || "").trim();

        // 1. Instant 0ms memory pre-seed
        if (docId && CAREPATH_INSTANT_DOCTOR_PHOTOS[docId]) {
          return CAREPATH_INSTANT_DOCTOR_PHOTOS[docId];
        }
        if (raw && CAREPATH_INSTANT_DOCTOR_PHOTOS[raw]) {
          return CAREPATH_INSTANT_DOCTOR_PHOTOS[raw];
        }

        // 2. Instant 0ms localStorage persistent cache
        try {
          if (docId) {
            const cached = localStorage.getItem("cp_doc_img_" + docId);
            if (cached && cached.startsWith("data:")) return cached;
          }
        } catch(e) {}

        if (!raw) return null;

        // 3. Local relative bundle path (0ms inside Capacitor APK or Vercel static asset)
        if (raw.startsWith("/doctor-photos/") || raw.startsWith("doctor-photos/")) {
          return raw.startsWith("/") ? raw.slice(1) : raw;
        }

        // 4. Remote HTTP URL
        return raw.startsWith("http") ? raw : (API + (raw.startsWith("/") ? "" : "/") + raw);
      },

      cacheImageAsync: function(docId, src) {
        if (!docId || !src || src.startsWith("data:") || !window.fetch) return;
        try {
          const key = "cp_doc_img_" + docId;
          if (localStorage.getItem(key)) return;
          fetch(src, { mode: "cors", cache: "force-cache" })
            .then(function(res) { return res.ok ? res.blob() : null; })
            .then(function(blob) {
              if (!blob) return;
              const reader = new FileReader();
              reader.onloadend = function() {
                try {
                  if (reader.result && reader.result.length < 65000) {
                    localStorage.setItem(key, reader.result);
                  }
                } catch(e) {}
              };
              reader.readAsDataURL(blob);
            })
            .catch(function() {});
        } catch(e) {}
      }
    };

    function resolveDoctorCoords(doc) {
      let lat = doc.hospital_latitude ?? doc.latitude ?? doc.lat;
      let lng = doc.hospital_longitude ?? doc.longitude ?? doc.lng;
      if (lat && lng && String(lat).toUpperCase() !== 'NULL' && String(lng).toUpperCase() !== 'NULL') {
        const pLat = parseFloat(lat);
        const pLng = parseFloat(lng);
        if (!isNaN(pLat) && !isNaN(pLng)) return { lat: pLat, lng: pLng };
      }
      const city = (doc.hospital_city || doc.hospital_name || '').toLowerCase();
      for (const [key, coords] of Object.entries(CITY_COORDS)) {
        if (city.includes(key)) return coords;
      }
      return null;
    }

    function calcDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(distKm) {
      if (distKm == null || isNaN(distKm)) return null;
      if (distKm < 1) return Math.round(distKm * 1000) + ' m away';
      if (distKm < 10) return distKm.toFixed(1) + ' km away';
      return Math.round(distKm) + ' km away';
    }

    function requestDoctorLocation() {
      const btn = document.getElementById("docLocActionBtn");
      const sub = document.getElementById("docLocSub");
      const topBtn = document.getElementById("topGpsText");

      if (btn) btn.textContent = "Detecting...";
      if (topBtn) topBtn.textContent = "Detecting...";
      if (sub) sub.textContent = "Accessing device GPS location...";

      if (!navigator.geolocation) {
        if (sub) sub.textContent = "Geolocation not supported";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          localStorage.setItem("carepath_user_lat", lat.toString());
          localStorage.setItem("carepath_user_lng", lng.toString());
          localStorage.setItem("carepath_loc_granted", "true");
          updateDocLocUI(lat, lng);
          renderCards();
        },
        (err) => {
          if (btn) btn.textContent = "Update 🎯";
          if (topBtn) topBtn.textContent = "Detect Location";
          if (sub) sub.textContent = "Location permission denied. Please allow in browser/settings.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

        </button>
      `).join("");

      container.querySelectorAll(".hosp-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const chosenId = btn.getAttribute("data-id");
          if (chosenId === "ALL") {
            activeHospitalId = null;
            activeHospitalName = null;
            localStorage.removeItem("selectedHospitalId");
          } else {
            activeHospitalId = chosenId;
            const hObj = hospitalMap.get(chosenId);
            activeHospitalName = hObj ? hObj.name : `Hospital #${chosenId}`;
            localStorage.setItem("hospital_id", chosenId);
            localStorage.setItem("selectedHospitalId", chosenId);
            localStorage.setItem("selectedHospitalName", activeHospitalName);
          }

          container.querySelectorAll(".hosp-tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          updateHeaderBanner();
          renderDepartmentChips();
          renderCards();
        });
      });
    }

    function renderDepartmentChips() {
      const container = document.getElementById("departmentChips");
      if (!container) return;

      let docsToScan = allDoctors;
      if (activeHospitalId && activeHospitalId !== "ALL") {
        docsToScan = allDoctors.filter(d => String(d.hospital_id) === String(activeHospitalId));
      }

      const depts = [...new Set(docsToScan.map(d => (d.department || "").trim()).filter(Boolean))].sort();

      const chipList = ["All Specialties", ...depts];

      container.innerHTML = chipList.map(dept => {
        const isAll = dept === "All Specialties";
        const val = isAll ? "" : dept;
        const isActive = selectedDeptFilter.toLowerCase() === val.toLowerCase();
        const icon = isAll ? "🩺" : (dept.toLowerCase().includes("cardio") ? "🫀" : (dept.toLowerCase().includes("ped") ? "👶" : "💊"));
        return `
          <button type="button" class="dept-chip-btn ${isActive ? 'active' : ''}" data-dept="${escapeHtml(val)}">
            <span>${icon}</span>
            <span>${escapeHtml(dept)}</span>
          </button>
        `;
      }).join("");

      container.querySelectorAll(".dept-chip-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedDeptFilter = btn.getAttribute("data-dept") || "";
          container.querySelectorAll(".dept-chip-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderCards();
        });
      });
    }

    function clearSearchInput() {
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearch");
      if (input) input.value = "";
      if (clearBtn) clearBtn.style.display = "none";
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById("doctorList");
      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearch");
      const countBadge = document.getElementById("totalDoctorsCountBadge");
      if (!container) return;

      const query = (searchInput ? searchInput.value : "").trim().toLowerCase();
      if (clearBtn) clearBtn.style.display = query ? "flex" : "none";

      let filtered = allDoctors;

      // Filter by hospital
      if (activeHospitalId && activeHospitalId !== "ALL") {
        filtered = filtered.filter(d => String(d.hospital_id) === String(activeHospitalId));
      }

      // Filter by department
      if (selectedDeptFilter) {
        filtered = filtered.filter(d => (d.department || "").trim().toLowerCase() === selectedDeptFilter.toLowerCase());
      }

      // Filter by search query
      if (query) {
        filtered = filtered.filter(d =>
          (d.name || "").toLowerCase().includes(query) ||
          (d.department || "").toLowerCase().includes(query) ||
          (d.specialization || "").toLowerCase().includes(query) ||
          (d.hospital_name || "").toLowerCase().includes(query) ||
          (d.hospital_city || "").toLowerCase().includes(query)
        );
      }

      // Sort by proximity if GPS available
      const userLat = parseFloat(localStorage.getItem("carepath_user_lat"));
      const userLng = parseFloat(localStorage.getItem("carepath_user_lng"));

      if (!isNaN(userLat) && !isNaN(userLng)) {
        filtered = filtered.map(doc => {
          const coords = resolveDoctorCoords(doc);
          let dist = null;
          if (coords) {
            dist = calcDistanceKm(userLat, userLng, coords.lat, coords.lng);
          }
          return {
            ...doc,
            distance_km: dist,
            distance_text: dist != null ? formatDistance(dist) : null
          };
        });

        filtered.sort((a, b) => {
          const dA = a.distance_km != null ? a.distance_km : 999999;
          const dB = b.distance_km != null ? b.distance_km : 999999;
          return dA - dB;
        });
      }

      if (countBadge) {
        countBadge.textContent = `${filtered.length} Doctor${filtered.length === 1 ? '' : 's'}`;
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box">
            <div style="font-size: 42px; margin-bottom: 8px;">🩺</div>
            <h3>No Doctors Match Filter</h3>
            <p>We couldn't find any doctors matching your search or filters. Try choosing "All Hospitals" or reset your search.</p>
            <button type="button" class="btn-reset-filters" onclick="resetAllDoctorFilters()">Reset Filters ↺</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(doc => {
        const isAvail = doc.is_available !== false;
        const hours = doc.consultation_hours_12h || (doc.start_time && doc.end_time ? `${doc.start_time} - ${doc.end_time}` : "9:00 AM - 4:00 PM");
        const room = doc.room_number ? doc.room_number : "OPD Room 1";
        const hospName = doc.hospital_name || "CarePath Partner Hospital";
        const photoSrc = CarePathDoctorPhotos.resolvePhotoSrc(doc);
        const rating = doc.rating || 4.9;
        const exp = doc.experience ? (doc.experience.includes("year") ? doc.experience : doc.experience + " Yrs") : "8+ Yrs Exp";
        const distStr = doc.distance_text ? `📍 ${doc.distance_text}` : null;
        const fee = doc.token_fee != null ? `₹${doc.token_fee}` : "₹50";

        return `
          <div class="doctor-card">
            <div>
              <div class="doc-top-profile">
                <div class="doc-avatar-wrap">
                  ${photoSrc
                    ? `<img src="${photoSrc}" alt="${escapeHtml(doc.name)}" fetchpriority="high" loading="eager" decoding="async" onload="CarePathDoctorPhotos.cacheImageAsync(${doc.id}, this.src)" onerror="this.parentElement.innerHTML='<span style=\'font-size:26px;\'>👨‍⚕️</span><span class=\'doc-verified-check\'>✓</span>'">`
                    : `<span style="font-size:26px;">👨‍⚕️</span>`
                  }
                  <span class="doc-verified-check">✓</span>
                </div>
                <div class="doc-primary-info">
                  <h3 class="doc-name-title">${escapeHtml(doc.name)}</h3>
                  <div class="doc-dept-badge">
                    <span>🩺</span>
                    <span>${escapeHtml(doc.department || "General OPD")}</span>
                  </div>
                  <div class="doc-stats-pills">
                    <span class="rating-pill">★ ${rating}</span>
                    <span class="exp-pill">${escapeHtml(exp)}</span>
                    <span class="exp-pill">${escapeHtml(doc.specialization || "Specialist")}</span>
                  </div>
                </div>
              </div>

              <!-- Hospital Banner Strip -->
              <div class="doc-hospital-banner" style="margin-top: 12px;">
                <span class="doc-hosp-name-text">🏥 ${escapeHtml(hospName)}${doc.hospital_city ? ` (${escapeHtml(doc.hospital_city)})` : ''}</span>
                ${distStr ? `<span class="doc-dist-badge">${distStr}</span>` : ''}
              </div>

              <!-- Consultation Specs Grid -->
              <div class="doc-spec-grid" style="margin-top: 10px;">
                <div class="spec-item">
                  <span class="spec-label">OPD Timing</span>
                  <span class="spec-val">🕒 ${escapeHtml(hours)}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Room / Cabin</span>
                  <span class="spec-val">🚪 ${escapeHtml(room)}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Available Days</span>
                  <span class="spec-val">📅 ${escapeHtml(doc.available_days || "Mon - Sat")}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Consultation Fee</span>
                  <span class="spec-val" style="color: #38bdf8;">🎫 ${fee} Token Fee</span>
                </div>
              </div>
            </div>

            <!-- Footer Action Row -->
            <div class="doc-footer-action">
              <div class="doc-status-col">
                <span class="doc-live-tag ${isAvail ? 'tag-available' : 'tag-unavailable'}">
                  ${isAvail ? '● On Duty Today' : '● Off Duty'}
                </span>
                <span class="tag-fee">Zero Wait Live Queue</span>
              </div>

              <button
                type="button"
                class="btn-book-token"
                ${!isAvail ? 'disabled' : ''}
                onclick="handleBookDoctor(${doc.id})"
              >
                ${isAvail ? 'Book Token →' : 'Unavailable Today'}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function resetAllDoctorFilters() {
      activeHospitalId = null;
      activeHospitalName = null;
      selectedDeptFilter = "";
      localStorage.removeItem("selectedHospitalId");
      clearSearchInput();
      renderHospitalTabs();
      renderDepartmentChips();
      renderCards();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    // ============================================================
    // 5. BOOK DOCTOR HANDLER (Smooth Token Checkout Routing)
    // ============================================================
    window.handleBookDoctor = function(docId) {
      const doctor = allDoctors.find(d => Number(d.id) === Number(docId));
      if (!doctor) return;

      const targetHospId = doctor.hospital_id || activeHospitalId || 15;
      const targetHospName = doctor.hospital_name || activeHospitalName || "CarePath Partner Hospital";

      localStorage.setItem("hospital_id", String(targetHospId));
      localStorage.setItem("hospitalId", String(targetHospId));
      localStorage.setItem("selectedHospitalId", String(targetHospId));
      localStorage.setItem("selectedHospitalName", targetHospName);
      localStorage.setItem("selectedHospitalTokenFee", String(doctor.token_fee || 50));

      localStorage.setItem("selectedDoctor", doctor.name || "");
      localStorage.setItem("selectedDoctorId", String(doctor.id || ""));
      localStorage.setItem("selectedDoctorPhoto", doctor.image_url || "");
      localStorage.setItem("selectedDoctorHours", doctor.consultation_hours_12h || "");
      localStorage.setItem("selectedDoctorRoomNumber", doctor.room_number || "");
      localStorage.setItem("selectedDepartment", doctor.department || "");
      localStorage.setItem("selectedDoctorSpecialization", doctor.specialization || "");
      localStorage.setItem("selectedDoctorDays", doctor.available_days || "Mon - Sat");

      window.location.href = "token.html";
    };

    // ============================================================
    // 6. BACKGROUND LIVE DATA FETCH
    // ============================================================
    async function fetchFreshData() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4500);

        const res = await fetch(`${API}/doctors`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const liveDoctors = await res.json();
          if (Array.isArray(liveDoctors) && liveDoctors.length > 0) {
            const enriched = liveDoctors.map(d => {
              if (!d.hospital_name) {
                const foundH = PRESEED_HOSPITALS.find(h => Number(h.id) === Number(d.hospital_id));
                if (foundH) d.hospital_name = foundH.name;
              }
              return d;
            });

            allDoctors = enriched;
            localStorage.setItem("carepath_cached_all_doctors", JSON.stringify(enriched));

            renderHospitalTabs();
            renderDepartmentChips();
            renderCards();
          }
        }
      } catch (err) {
        console.log("Background sync completed or offline mode:", err.message);
      }
    }

    // ============================================================
    // 7. INITIALIZE LISTENERS & BOOTSTRAP
    // ============================================================
    document.getElementById("searchInput").addEventListener("input", renderCards);

    // Run Instant Data (0ms)
    initInstantData();

    // Check saved location & trigger GPS refresh
    const savedLat = parseFloat(localStorage.getItem("carepath_user_lat"));
    const savedLng = parseFloat(localStorage.getItem("carepath_user_lng"));
    if (!isNaN(savedLat) && !isNaN(savedLng)) {
      updateDocLocUI(savedLat, savedLng);
    } else {
      requestDoctorLocation();
    }

    // Silent background sync
    fetchFreshData();
  </script>
</body>

</html>
