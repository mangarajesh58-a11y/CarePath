
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile - CarePath</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eef2ff);
        }

        .profile-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            color: white;
            background: #2563eb;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="profile-card">
        <h1>CarePath</h1>

        <p class="subtitle">
            Complete your patient profile to continue.
        </p>

        <div id="message" role="status" aria-live="polite"></div>

        <form id="profileForm">
            <label for="fullName">Full Name</label>
            <input
                id="fullName"
                type="text"
                readonly
            >

            <label for="email">Google Email</label>
            <input
                id="email"
                type="email"
                readonly
            >

            <label for="phone">Phone Number</label>
            <input
                id="phone"
                type="tel"
                placeholder="Enter your phone number"
                autocomplete="tel"
                maxlength="20"
                required
            >

            <button id="saveButton" type="submit">
                Save Profile & Continue
            </button>
        </form>

        <a class="back-link" href="index.html">
            Back to Login
        </a>
    </main>

    <script>
        const API = "https://carepath-3q9q.onrender.com";

        const credential = sessionStorage.getItem(
            "patientGoogleCredential"
        );

        const name = localStorage.getItem("patientName") || "";
        const email = localStorage.getItem("patientEmail") || "";

        document.getElementById("fullName").value = name;
        document.getElementById("email").value = email;

        const form = document.getElementById("profileForm");
        const phoneInput = document.getElementById("phone");
        const saveButton = document.getElementById("saveButton");
        const messageElement = document.getElementById("message");

        function showMessage(message, type) {
            messageElement.textContent = message;
            messageElement.className = type;
        }

        if (!credential) {
            form.hidden = true;
            showMessage(
                "Your Google sign-in session is missing or expired. Please sign in again.",
                "error"
            );
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!credential) {
                showMessage(
                    "Please return to login and sign in with Google again.",
                    "error"
                );
                return;
            }

            const phone = phoneInput.value.trim();

            if (!phone) {
                showMessage(
                    "Please enter your phone number.",
                    "error"
                );
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Saving Profile...";

            try {
                const response = await fetch(
                    `${API}/patients/profile`,
                    {
                        method: "PUT",
                       headers: {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${localStorage.getItem("patientToken") || ""}`
},
                        body: JSON.stringify({
                            credential: credential,
                            phone: phone
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        typeof data.detail === "string"
                            ? data.detail
                            : "Unable to save your profile."
                    );
                }

                const patient = data.patient;

                if (!patient) {
                    throw new Error(
                        "The server did not return patient information."
                    );
                }

                if (patient.id != null) {
                    localStorage.setItem("patientId", patient.id);
                }

                if (patient.full_name) {
                    localStorage.setItem(
                        "patientName",
                        patient.full_name
                    );
                }

                if (patient.email) {
                    localStorage.setItem(
                        "patientEmail",
                        patient.email
                    );
                }

                if (patient.phone) {
                    localStorage.setItem(
                        "patientPhone",
                        patient.phone
                    );
                }

                sessionStorage.removeItem(
                    "patientGoogleCredential"
                );

                showMessage(
                    "Profile saved successfully. Opening dashboard...",
                    "success"
                );

                setTimeout(function() {
                    window.location.href = "dashboard.html";
                }, 800);

            } catch (error) {
                showMessage(
                    error.message || "Unable to save your profile.",
                    "error"
                );
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save Profile & Continue";
            }
        });
    </script>
</body>
</html>
