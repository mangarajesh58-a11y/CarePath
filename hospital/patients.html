<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Queue - CarePath</title>
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #2563eb;
            --dark: #172554;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 14px 40px rgba(15,23,42,.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: #172033;
            background:
                radial-gradient(circle at 8% 0%, #dbeafe 0, transparent 32%),
                linear-gradient(135deg, #f8fbff, #eef4ff);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .page-container {
            width: min(1180px, calc(100% - 32px));
            margin: 28px auto 48px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 22px 26px;
            color: white;
            border-radius: 22px;
            background: linear-gradient(120deg, #102a66, #2563eb 65%, #38bdf8);
            box-shadow: 0 18px 40px rgba(37,99,235,.2);
        }

        header h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: -.7px;
        }

        header p {
            margin: 5px 0 0;
            color: #dbeafe;
            font-size: 14px;
        }

        button, select { font: inherit; }

        button {
            border: 0;
            border-radius: 11px;
            padding: 11px 16px;
            font-weight: 700;
            color: white;
            background: var(--primary);
            cursor: pointer;
            transition: .18s ease;
            box-shadow: 0 5px 12px rgba(37,99,235,.14);
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(.97);
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .logout {
            color: #1e3a8a;
            background: white;
            box-shadow: none;
        }

        .welcome { padding: 28px 4px 18px; }

        .welcome h2 {
            margin: 0 0 7px;
            color: var(--dark);
            font-size: clamp(24px, 4vw, 32px);
            letter-spacing: -.8px;
        }

        .welcome p { margin: 0; color: var(--muted); }

        .form-card, .list-card {
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(226,232,240,.9);
            border-radius: 20px;
            padding: 24px;
            margin: 18px 0;
            box-shadow: var(--shadow);
        }

        .form-card h2, .list-card h2 {
            margin: 0 0 20px;
            color: var(--dark);
            font-size: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #334155;
            font-weight: 700;
            font-size: 14px;
        }

        select {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            background: white;
            color: #0f172a;
            outline: none;
        }

        select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px #dbeafe;
        }

        #nextPatientButton {
            margin-top: 18px !important;
            padding: 13px 20px;
        }

        #currentPatient {
            background: linear-gradient(120deg, #eff6ff, #f0f9ff) !important;
            border: 1px solid #bfdbfe !important;
        }

        #currentPatient h3 { color: #1d4ed8; }

        #currentPatientText {
            color: #1e3a8a;
            font-size: 17px;
            line-height: 1.7;
        }

        #refreshQueueButton {
            background: #eff6ff;
            color: #1d4ed8;
            box-shadow: none;
            border: 1px solid #bfdbfe;
        }

        #queueMessage {
            border: 1px solid transparent;
            font-weight: 600;
        }

        table {
            border-collapse: separate !important;
            border-spacing: 0;
            overflow: hidden;
        }

        thead th {
            background: #eff4ff;
            color: #334155;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            background: white;
            color: #334155;
            border-bottom: 1px solid #edf2f7;
        }

        tbody tr:hover td { background: #f8fbff; }
        tbody tr:last-child td { border-bottom: 0; }

        .back-button {
            margin-top: 8px;
            background: #e2e8f0;
            color: #334155;
            box-shadow: none;
        }

        @media(max-width: 640px) {
            .page-container {
                width: calc(100% - 20px);
                margin: 10px auto 28px;
            }

            header { padding: 18px; border-radius: 17px; }
            header h1 { font-size: 23px; }

            .form-card, .list-card {
                padding: 17px;
                border-radius: 16px;
            }

            .welcome { padding: 22px 3px 12px; }
            #nextPatientButton { width: 100%; }
        }

        @media(prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>

<body>
<div class="page-container">

    <header>
        <div>
            <h1>CarePath</h1>
            <p>Hospital Token Queue</p>
        </div>

        <button type="button" class="logout" onclick="hospitalLogout()">
            Logout
        </button>
    </header>

    <div class="welcome">
        <h2>Patient Queue</h2>
        <p>Select a department and doctor to manage the patient queue.</p>
    </div>

    <div class="form-card">
        <h2>Select Queue</h2>

        <label for="queueDepartment">Department</label>
        <select id="queueDepartment" onchange="loadQueueDoctors()">
            <option value="">Loading departments...</option>
        </select>

        <label for="queueDoctor">Doctor</label>
        <select id="queueDoctor" onchange="loadPatients()" disabled>
            <option value="">Select Doctor</option>
        </select>

        <div id="currentPatient"
             style="display:none;margin-top:20px;padding:18px;border-radius:12px;">
            <h3 style="margin-top:0;">📢 Current Patient</h3>
            <p id="currentPatientText"></p>
        </div>

        <button type="button" id="nextPatientButton" onclick="callNextPatient">
            📢 Call Next Patient
        </button>
    </div>

    <div class="list-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h2>Patient Tokens</h2>
            <button type="button" id="refreshQueueButton" onclick="loadPatients()">
                🔄 Refresh
            </button>
        </div>

        <div id="queueMessage"
             style="display:none;margin-top:15px;padding:12px;border-radius:8px;">
        </div>

        <div style="width:100%;overflow-x:auto;margin-top:20px;">
            <table style="width:100%;border-collapse:collapse;min-width:750px;">
                <thead>
                    <tr>
                        <th style="padding:12px;text-align:left;">Token</th>
                        <th style="padding:12px;text-align:left;">Patient</th>
                        <th style="padding:12px;text-align:left;">Department</th>
                        <th style="padding:12px;text-align:left;">Doctor</th>
                        <th style="padding:12px;text-align:left;">Status</th>
                        <th style="padding:12px;text-align:left;">Action</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr>
                        <td colspan="6" style="padding:20px;text-align:center;">
                            Select a department and doctor.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button type="button" class="back-button" onclick="goDashboard()">
        Back to Dashboard
    </button>

</div>

<script>
"use strict";

const API = "https://carepath-3q9q.onrender.com";

const hospitalId = localStorage.getItem("hospital_id");
const hospitalToken = localStorage.getItem("hospitalToken");

if (!hospitalId || !hospitalToken) {
    alert("Hospital login required.");
    window.location.replace("index.html");
}

function getHospitalAuthHeaders(includeJson = false) {
    const headers = {
        "Authorization": `Bearer ${hospitalToken}`
    };

    if (includeJson) {
        headers["Content-Type"] = "application/json";
    }

    return headers;
}

let isLoadingPatients = false;

async function getCurrentHospital() {
    const response = await fetch(`${API}/hospitals/${hospitalId}`, {
        headers: getHospitalAuthHeaders()
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.detail || "Unable to load hospital information.");
    }

    return data;
}

async function loadQueueDepartments() {
    const departmentSelect = document.getElementById("queueDepartment");
    const doctorSelect = document.getElementById("queueDoctor");

    departmentSelect.innerHTML = `<option value="">Loading departments...</option>`;
    doctorSelect.innerHTML = `<option value="">Select Doctor</option>`;
    doctorSelect.disabled = true;

    try {
        const response = await fetch(`${API}/hospitals/${hospitalId}/departments`, {
            headers: getHospitalAuthHeaders()
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load departments.");
        }

        const departments = Array.isArray(data)
            ? data
            : (data.departments || []);

        departmentSelect.innerHTML = `<option value="">Select Department</option>`;

        if (departments.length === 0) {
            departmentSelect.innerHTML = `<option value="">No departments added</option>`;
            return;
        }

        departments.forEach(function(department) {
            const option = document.createElement("option");
            option.value = department;
            option.textContent = department;
            departmentSelect.appendChild(option);
        });
    } catch (error) {
        console.error("Department error:", error);
        departmentSelect.innerHTML = `<option value="">Cannot load departments</option>`;
        showQueueMessage(error.message, false);
    }
}

async function loadQueueDoctors() {
    const department = document.getElementById("queueDepartment").value;
    const doctorSelect = document.getElementById("queueDoctor");

    doctorSelect.innerHTML = `<option value="">Select Doctor</option>`;
    doctorSelect.disabled = true;
    clearPatients();

    if (!department) return;

    try {
        const response = await fetch(`${API}/hospitals/${hospitalId}/doctors`, {
            headers: getHospitalAuthHeaders()
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load doctors.");
        }

        const doctors = Array.isArray(data)
            ? data
            : (data.doctors || []);

        const filteredDoctors = doctors.filter(function(doctor) {
            return doctor.department === department;
        });

        if (filteredDoctors.length === 0) {
            doctorSelect.innerHTML = `<option value="">No doctors added</option>`;
            return;
        }

        filteredDoctors.forEach(function(doctor) {
            const option = document.createElement("option");
            option.value = doctor.id;
            option.textContent = doctor.name;
            option.dataset.name = doctor.name;
            doctorSelect.appendChild(option);
        });

        doctorSelect.disabled = false;
    } catch (error) {
        console.error("Doctor error:", error);
        doctorSelect.innerHTML = `<option value="">Cannot load doctors</option>`;
        showQueueMessage(error.message, false);
    }
}

function getSelectedDoctorName() {
    const doctorSelect = document.getElementById("queueDoctor");
    const selectedOption = doctorSelect.options[doctorSelect.selectedIndex];

    if (!selectedOption || !selectedOption.value) return "";

    return selectedOption.dataset.name || selectedOption.textContent || "";
}

async function loadPatients(silent = false) {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();
    const tableBody = document.getElementById("patientTableBody");

    if (!department || !doctor) {
        clearPatients();
        return;
    }

    if (isLoadingPatients) return;
    isLoadingPatients = true;

    if (!silent) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="6" style="padding:20px;text-align:center;">
                    Loading patients...
                </td>
            </tr>
        `;
    }

    try {
        const response = await fetch(`${API}/hospitals/${hospitalId}/tokens`, {
            headers: getHospitalAuthHeaders()
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load tokens.");
        }

        const tokens = Array.isArray(data) ? data : (data.tokens || []);
        const hospital = await getCurrentHospital();

        const hospitalTokens = tokens.filter(function(token) {
            const correctHospital =
                token.hospital_id !== undefined && token.hospital_id !== null
                    ? Number(token.hospital_id) === Number(hospital.id)
                    : token.hospital === hospital.name;

            const status = String(token.status || "").toLowerCase();

            return (
                correctHospital &&
                token.department === department &&
                token.doctor === doctor &&
                ["waiting", "serving"].includes(status)
            );
        });

        hospitalTokens.sort(function(a, b) {
            return Number(a.token_number || 0) - Number(b.token_number || 0);
        });

        if (hospitalTokens.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" style="padding:20px;text-align:center;">
                        No patients waiting for this doctor.
                    </td>
                </tr>
            `;
            return;
        }

        const fragment = document.createDocumentFragment();

        hospitalTokens.forEach(function(token) {
            const row = document.createElement("tr");
            const status = String(token.status || "").toLowerCase();

            const editTokenButtonHtml =
                ["waiting", "serving"].includes(status)
                    ? `<button type="button"
                        onclick="editPatientTokenNumber(${Number(token.id)}, ${Number(token.token_number)})"
                        style="background:#2563eb;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;margin-right:6px;">
                        Edit Token
                       </button>`
                    : "";

            const completeButtonHtml =
                !["completed", "cancelled"].includes(status)
                    ? `<button type="button"
                        onclick="completePatientToken(${Number(token.id)})"
                        style="background:#16a34a;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">
                        Complete
                       </button>`
                    : "—";

            row.innerHTML = `
                <td style="padding:12px;"><strong>${escapeHTML(token.token_number)}</strong></td>
                <td style="padding:12px;">${escapeHTML(token.patient_name)}</td>
                <td style="padding:12px;">${escapeHTML(token.department)}</td>
                <td style="padding:12px;">${escapeHTML(token.doctor)}</td>
                <td style="padding:12px;">${getStatusText(token.status)}</td>
                <td style="padding:12px;white-space:nowrap;">
                    ${editTokenButtonHtml}
                    ${completeButtonHtml}
                </td>
            `;

            fragment.appendChild(row);
        });

        tableBody.replaceChildren(fragment);
    } catch (error) {
        console.error("Patient queue error:", error);

        if (!silent) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" style="padding:20px;text-align:center;">
                        Cannot load patient queue.<br><br>
                        ${escapeHTML(error.message)}
                    </td>
                </tr>
            `;
        }
    } finally {
        isLoadingPatients = false;
    }
}

async function callNextPatient() {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();

    if (!department) {
        alert("Please select a department.");
        return;
    }

    if (!doctor) {
        alert("Please select a doctor.");
        return;
    }

    const button = document.getElementById("nextPatientButton");
    button.disabled = true;
    button.textContent = "Calling...";

    try {
        const response = await fetch(`${API}/next-patient`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...getHospitalAuthHeaders()
            },
            body: JSON.stringify({
                hospital_id: Number(hospitalId),
                department: department,
                doctor: doctor
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to call next patient.");
        }

        if (data.token_number !== undefined && data.token_number !== null) {
            const patientName = data.patient_name || data.patient || "Patient";
            showCurrentPatient(data.token_number, patientName);

            alert(
                "📢 Patient Called\n\nToken: " + data.token_number +
                "\nPatient: " + patientName
            );
        } else if (data.token !== undefined && data.token !== null) {
            const patientName = data.patient || "Patient";
            showCurrentPatient(data.token, patientName);

            alert(
                "📢 Patient Called\n\nToken: " + data.token +
                "\nPatient: " + patientName
            );
        } else {
            alert(data.message || "No waiting patients.");
        }

        await loadPatients();
    } catch (error) {
        console.error("Call next patient error:", error);
        alert(error.message || "Unable to call next patient.");
    } finally {
        button.disabled = false;
        button.textContent = "📢 Call Next Patient";
    }
}

async function editPatientTokenNumber(tokenId, currentTokenNumber) {
    if (!tokenId || !Number.isFinite(Number(tokenId))) {
        alert("Invalid token ID.");
        return;
    }

    const input = prompt(
        "Enter the new token number:",
        String(currentTokenNumber)
    );

    if (input === null) return;

    const newTokenNumber = input.trim();

    if (!/^[1-9]\d*$/.test(newTokenNumber)) {
        alert("Enter a valid positive whole-number token.");
        return;
    }

    if (Number(newTokenNumber) === Number(currentTokenNumber)) {
        alert("The token number has not changed.");
        return;
    }

    if (!confirm(
        `Change token number ${currentTokenNumber} to ${newTokenNumber}?`
    )) {
        return;
    }

    try {
        const response = await fetch(
            `${API}/tokens/${Number(tokenId)}/number`,
            {
                method: "PUT",
                headers: getHospitalAuthHeaders(true),
                body: JSON.stringify({
                    token_number: Number(newTokenNumber)
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Unable to update token number."
            );
        }

        showQueueMessage(
            `Token number updated to ${newTokenNumber}.`,
            true
        );

        await loadPatients();
    } catch (error) {
        console.error("Edit token error:", error);
        showQueueMessage(error.message, false);
    }
}

async function completePatientToken(tokenId) {
    if (!tokenId || !Number.isFinite(Number(tokenId))) {
        alert("Invalid token ID.");
        return;
    }

    if (!confirm("Mark this patient as completed?")) return;

    try {
        const response = await fetch(`${API}/tokens/${tokenId}/complete`, {
            method: "PUT",
            headers: getHospitalAuthHeaders()
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to complete token.");
        }

        alert(data.message || "Patient token completed successfully.");
        await loadPatients();
    } catch (error) {
        console.error("Complete token error:", error);
        alert(error.message || "Unable to complete patient token.");
    }
}

function showCurrentPatient(token, patient) {
    const box = document.getElementById("currentPatient");
    const text = document.getElementById("currentPatientText");

    text.innerHTML = `
        <strong>Token:</strong> ${escapeHTML(token)}
        <br>
        <strong>Patient:</strong> ${escapeHTML(patient)}
    `;

    box.style.display = "block";
}

function clearPatients() {
    const tableBody = document.getElementById("patientTableBody");

    tableBody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:20px;text-align:center;">
                Select a department and doctor.
            </td>
        </tr>
    `;

    document.getElementById("currentPatient").style.display = "none";
}

function getStatusText(status) {
    const normalized = String(status || "").toLowerCase();

    if (normalized === "waiting") return "🟡 Waiting";
    if (normalized === "serving") return "🟢 Serving";
    if (normalized === "completed") return "✅ Completed";
    if (normalized === "cancelled") return "🔴 Cancelled";

    return escapeHTML(status || "Unknown");
}

function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showQueueMessage(message, success) {
    const element = document.getElementById("queueMessage");

    element.textContent = message;
    element.style.display = "block";
    element.style.background = success ? "#dcfce7" : "#fee2e2";
    element.style.color = success ? "#166534" : "#991b1b";
}

function goDashboard() {
    window.location.href = "dashboard.html";
}

function hospitalLogout() {
    [
        "hospital_id",
        "hospital_name",
        "hospital_email",
        "hospital_token_fee",
        "hospital_approval_status",
        "hospital_is_published",
        "hospital_latitude",
        "hospital_longitude",
        "hospitalLoggedIn",
        "hospitalToken"
    ].forEach(function(key) {
        localStorage.removeItem(key);
    });

    window.location.href = "index.html";
}

loadQueueDepartments();

setInterval(function() {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();

    if (department && doctor && !document.hidden) {
        loadPatients(true);
    }
}, 5000);

</script>
</body>
</html>
