<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Queue - HospitalCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="page-container">

    <header>

        <div>

            <h1>🏥 HospitalCare</h1>

            <p>Patient Token Queue</p>

        </div>

        <button
            class="logout"
            onclick="hospitalLogout()"
        >
            Logout
        </button>

    </header>


    <div class="welcome">

        <h2>Patient Queue</h2>

        <p>
            Select a department and doctor to manage the queue.
        </p>

    </div>


    <!-- =========================
         QUEUE SELECTION
    ========================== -->

    <div class="form-card">

        <h2>📋 Select Queue</h2>


        <label for="queueDepartment">
            Department
        </label>

        <select
            id="queueDepartment"
            onchange="loadQueueDoctors()"
        >

            <option value="">
                Loading departments...
            </option>

        </select>


        <label for="queueDoctor">
            Doctor
        </label>

        <select
            id="queueDoctor"
            onchange="loadPatients()"
            disabled
        >

            <option value="">
                Select Doctor
            </option>

        </select>


        <button
            type="button"
            onclick="callNextPatient()"
        >
            📢 Call Next Patient
        </button>

    </div>


    <!-- =========================
         PATIENT QUEUE
    ========================== -->

    <div class="list-card">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                flex-wrap:wrap;
                gap:10px;
            "
        >

            <h2>
                🎫 Patient Tokens
            </h2>

            <button
                type="button"
                onclick="loadPatients()"
            >
                🔄 Refresh
            </button>

        </div>


        <div
            style="
                width:100%;
                overflow-x:auto;
                margin-top:20px;
            "
        >

            <table
                style="
                    width:100%;
                    border-collapse:collapse;
                    min-width:700px;
                "
            >

                <thead>

                    <tr>

                        <th style="padding:12px;text-align:left;">
                            Token
                        </th>

                        <th style="padding:12px;text-align:left;">
                            Patient
                        </th>

                        <th style="padding:12px;text-align:left;">
                            Department
                        </th>

                        <th style="padding:12px;text-align:left;">
                            Doctor
                        </th>

                        <th style="padding:12px;text-align:left;">
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="patientTableBody">

                    <tr>

                        <td
                            colspan="5"
                            style="
                                padding:20px;
                                text-align:center;
                            "
                        >
                            Select a department and doctor.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <button
        class="back-button"
        onclick="goDashboard()"
    >
        ← Back to Dashboard
    </button>

</div>


<script>

const API = "http://127.0.0.1:8000";


// ========================================
// GET CURRENT HOSPITAL
// ========================================

function getHospitalName() {

    return localStorage.getItem(
        "hospitalName"
    );

}


// ========================================
// FIND HOSPITAL
// ========================================

async function getCurrentHospital() {

    const hospitalName =
        getHospitalName();

    if (!hospitalName) {

        throw new Error(
            "Hospital information not found."
        );

    }


    const response =
        await fetch(
            API + "/hospitals"
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load hospitals."
        );

    }


    const hospitals =
        await response.json();


    const hospital =
        hospitals.find(
            function(item) {

                return item.name === hospitalName;

            }
        );


    if (!hospital) {

        throw new Error(
            "Your hospital was not found in the database."
        );

    }


    return hospital;

}


// ========================================
// LOAD DEPARTMENTS
// ========================================

async function loadQueueDepartments() {

    const departmentSelect =
        document.getElementById(
            "queueDepartment"
        );


    try {

        const hospital =
            await getCurrentHospital();


        const response =
            await fetch(
                API +
                "/hospitals/" +
                hospital.id +
                "/departments"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load departments."
            );

        }


        const departments =
            await response.json();


        departmentSelect.innerHTML =
            `<option value="">
                Select Department
             </option>`;


        if (
            !departments ||
            departments.length === 0
        ) {

            departmentSelect.innerHTML =
                `<option value="">
                    No departments added
                 </option>`;

            return;

        }


        departments.forEach(
            function(department) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    department;

                option.textContent =
                    department;

                departmentSelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(error);

        departmentSelect.innerHTML =
            `<option value="">
                Cannot load departments
             </option>`;

    }

}


// ========================================
// LOAD DOCTORS
// ========================================

async function loadQueueDoctors() {

    const department =
        document.getElementById(
            "queueDepartment"
        ).value;


    const doctorSelect =
        document.getElementById(
            "queueDoctor"
        );


    doctorSelect.innerHTML =
        `<option value="">
            Select Doctor
         </option>`;

    doctorSelect.disabled = true;


    if (!department) {

        clearPatients();

        return;

    }


    try {

        const hospital =
            await getCurrentHospital();


        const response =
            await fetch(
                API +
                "/hospitals/" +
                hospital.id +
                "/doctors"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load doctors."
            );

        }


        const doctors =
            await response.json();


        const filteredDoctors =
            doctors.filter(
                function(doctor) {

                    return (
                        doctor.department ===
                        department
                    );

                }
            );


        if (
            filteredDoctors.length === 0
        ) {

            doctorSelect.innerHTML =
                `<option value="">
                    No doctors added
                 </option>`;

            clearPatients();

            return;

        }


        filteredDoctors.forEach(
            function(doctor) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    doctor.name;

                option.textContent =
                    doctor.name;

                doctorSelect.appendChild(
                    option
                );

            }
        );


        doctorSelect.disabled = false;


        clearPatients();


    } catch (error) {

        console.error(error);

        doctorSelect.innerHTML =
            `<option value="">
                Cannot load doctors
             </option>`;

    }

}


// ========================================
// LOAD PATIENTS
// ========================================

async function loadPatients() {

    const department =
        document.getElementById(
            "queueDepartment"
        ).value;


    const doctor =
        document.getElementById(
            "queueDoctor"
        ).value;


    const tableBody =
        document.getElementById(
            "patientTableBody"
        );


    if (!department || !doctor) {

        clearPatients();

        return;

    }


    tableBody.innerHTML =
        `<tr>

            <td
                colspan="5"
                style="
                    padding:20px;
                    text-align:center;
                "
            >
                Loading patients...
            </td>

        </tr>`;


    try {

        const hospitalName =
            getHospitalName();


        const response =
            await fetch(
                API + "/tokens"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load tokens."
            );

        }


        const tokens =
            await response.json();


        const hospitalTokens =
            tokens.filter(
                function(token) {

                    return (
                        token.hospital ===
                        hospitalName &&

                        token.department ===
                        department &&

                        token.doctor ===
                        doctor
                    );

                }
            );


        if (
            hospitalTokens.length === 0
        ) {

            tableBody.innerHTML =
                `<tr>

                    <td
                        colspan="5"
                        style="
                            padding:20px;
                            text-align:center;
                        "
                    >
                        No patients waiting for
                        this doctor.
                    </td>

                </tr>`;

            return;

        }


        tableBody.innerHTML = "";


        hospitalTokens.forEach(
            function(token) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td style="padding:12px;">
                        <strong>
                            ${escapeHTML(
                                token.token_number
                            )}
                        </strong>
                    </td>

                    <td style="padding:12px;">
                        ${escapeHTML(
                            token.patient_name
                        )}
                    </td>

                    <td style="padding:12px;">
                        ${escapeHTML(
                            token.department
                        )}
                    </td>

                    <td style="padding:12px;">
                        ${escapeHTML(
                            token.doctor
                        )}
                    </td>

                    <td style="padding:12px;">
                        ${getStatusText(
                            token.status
                        )}
                    </td>

                `;


                tableBody.appendChild(row);

            }
        );


    } catch (error) {

        console.error(error);

        tableBody.innerHTML =
            `<tr>

                <td
                    colspan="5"
                    style="
                        padding:20px;
                        text-align:center;
                    "
                >
                    Cannot connect to FastAPI.
                    <br><br>
                    Make sure the backend is running.
                </td>

            </tr>`;

    }

}


// ========================================
// CALL NEXT PATIENT
// ========================================

async function callNextPatient() {

    const hospital =
        getHospitalName();


    const department =
        document.getElementById(
            "queueDepartment"
        ).value;


    const doctor =
        document.getElementById(
            "queueDoctor"
        ).value;


    if (!hospital) {

        alert(
            "Hospital information not found."
        );

        return;

    }


    if (!department) {

        alert(
            "Please select a department."
        );

        return;

    }


    if (!doctor) {

        alert(
            "Please select a doctor."
        );

        return;

    }


    try {

        const url =
            API +
            "/next-patient" +
            "?hospital=" +
            encodeURIComponent(hospital) +
            "&department=" +
            encodeURIComponent(department) +
            "&doctor=" +
            encodeURIComponent(doctor);


        const response =
            await fetch(
                url,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Unable to call next patient."
            );

            return;

        }


        if (data.token) {

            alert(
                "📢 Patient Called\n\n" +
                "Token: " +
                data.token +
                "\n" +
                "Patient: " +
                data.patient +
                "\n\n" +
                "Department: " +
                department +
                "\n" +
                "Doctor: " +
                doctor
            );

        } else {

            alert(
                data.message ||
                "No waiting patients."
            );

        }


        await loadPatients();


    } catch (error) {

        console.error(error);

        alert(
            "Cannot connect to FastAPI.\n\n" +
            "Make sure the backend is running."
        );

    }

}


// ========================================
// CLEAR PATIENT TABLE
// ========================================

function clearPatients() {

    const tableBody =
        document.getElementById(
            "patientTableBody"
        );


    tableBody.innerHTML =
        `<tr>

            <td
                colspan="5"
                style="
                    padding:20px;
                    text-align:center;
                "
            >
                Select a department and doctor.
            </td>

        </tr>`;

}


// ========================================
// STATUS
// ========================================

function getStatusText(status) {

    if (status === "waiting") {

        return "🟡 Waiting";

    }


    if (status === "serving") {

        return "🟢 Serving";

    }


    if (status === "completed") {

        return "✅ Completed";

    }


    return escapeHTML(status);

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// DASHBOARD
// ========================================

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


// ========================================
// LOGOUT
// ========================================

function hospitalLogout() {

    localStorage.removeItem(
        "hospitalLoggedIn"
    );

    window.location.href =
        "index.html";

}


// ========================================
// INITIAL LOAD
// ========================================

loadQueueDepartments();


// ========================================
// AUTO REFRESH
// ========================================

setInterval(
    function() {

        const department =
            document.getElementById(
                "queueDepartment"
            ).value;


        const doctor =
            document.getElementById(
                "queueDoctor"
            ).value;


        if (department && doctor) {

            loadPatients();

        }

    },
    5000
);

</script>

</body>

</html>
