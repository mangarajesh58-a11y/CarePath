
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Queue - CarePath</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="page-container">

    <header>
        <div>
            <h1>🏥 CarePath</h1>
            <p>Patient Token Queue</p>
        </div>
        <button type="button" class="logout" onclick="hospitalLogout()">
            Logout
        </button>
    </header>

    <div class="welcome">
        <h2>Patient Queue</h2>
        <p>Select a department and doctor to manage the patient queue.</p>
    </div>

    <div class="form-card">
        <h2>📋 Select Queue</h2>

        <label for="queueDepartment">Department</label>
        <select id="queueDepartment" onchange="loadQueueDoctors()">
            <option value="">Loading departments...</option>
        </select>

        <label for="queueDoctor">Doctor</label>
        <select id="queueDoctor" onchange="loadPatients()" disabled>
            <option value="">Select Doctor</option>
        </select>

        <div id="currentPatient"
             style="display:none;margin-top:20px;padding:18px;border-radius:12px;background:#eef6ff;border:1px solid #bfdbfe;">
            <h3 style="margin-top:0;">📢 Current Patient</h3>
            <p id="currentPatientText"></p>
        </div>

        <button type="button" id="nextPatientButton"
                onclick="callNextPatient()" style="margin-top:15px;">
            📢 Call Next Patient
        </button>
    </div>

    <div class="list-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <h2>🎫 Patient Tokens</h2>
            <button type="button" id="refreshQueueButton" onclick="loadPatients()">
                🔄 Refresh
            </button>
        </div>

        <div id="queueMessage"
             style="display:none;margin-top:15px;padding:12px;border-radius:8px;">
        </div>

        <div style="width:100%;overflow-x:auto;margin-top:20px;">
            <table style="width:100%;border-collapse:collapse;min-width:750px;">
                <thead>
                    <tr>
                        <th style="padding:12px;text-align:left;">Token</th>
                        <th style="padding:12px;text-align:left;">Patient</th>
                        <th style="padding:12px;text-align:left;">Department</th>
                        <th style="padding:12px;text-align:left;">Doctor</th>
                        <th style="padding:12px;text-align:left;">Status</th>
                        <th style="padding:12px;text-align:left;">Action</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr>
                        <td colspan="6" style="padding:20px;text-align:center;">
                            Select a department and doctor.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button type="button" class="back-button" onclick="goDashboard()">
        ← Back to Dashboard
    </button>
</div>

<script>
"use strict";

/* API */
const API = "https://carepath-3q9q.onrender.com";

/* Hospital ID */
const hospitalId = localStorage.getItem("hospital_id");

/* Prevent overlapping patient queue requests */
let isLoadingPatients = false;

/* Check hospital login */
if (!hospitalId) {
    alert("Hospital login required.");
    window.location.replace("index.html");
}

/* Get current hospital */
async function getCurrentHospital() {
    const response = await fetch(`${API}/hospitals/${hospitalId}`);
    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.detail || "Unable to load hospital information.");
    }

    return data;
}

/* Load departments */
async function loadQueueDepartments() {
    const departmentSelect = document.getElementById("queueDepartment");
    const doctorSelect = document.getElementById("queueDoctor");

    departmentSelect.innerHTML = `<option value="">Loading departments...</option>`;
    doctorSelect.innerHTML = `<option value="">Select Doctor</option>`;
    doctorSelect.disabled = true;

    try {
        const response = await fetch(`${API}/hospitals/${hospitalId}/departments`);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load departments.");
        }

        const departments = Array.isArray(data) ? data : (data.departments || []);

        departmentSelect.innerHTML = `<option value="">Select Department</option>`;

        if (departments.length === 0) {
            departmentSelect.innerHTML = `<option value="">No departments added</option>`;
            return;
        }

        departments.forEach(function(department) {
            const option = document.createElement("option");
            option.value = department;
            option.textContent = department;
            departmentSelect.appendChild(option);
        });
    } catch (error) {
        console.error("Department error:", error);
        departmentSelect.innerHTML = `<option value="">Cannot load departments</option>`;
        showQueueMessage(error.message, false);
    }
}

/* Load doctors */
async function loadQueueDoctors() {
    const department = document.getElementById("queueDepartment").value;
    const doctorSelect = document.getElementById("queueDoctor");

    doctorSelect.innerHTML = `<option value="">Select Doctor</option>`;
    doctorSelect.disabled = true;
    clearPatients();

    if (!department) return;

    try {
        const response = await fetch(`${API}/hospitals/${hospitalId}/doctors`);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load doctors.");
        }

        const doctors = Array.isArray(data) ? data : (data.doctors || []);
        const filteredDoctors = doctors.filter(function(doctor) {
            return doctor.department === department;
        });

        if (filteredDoctors.length === 0) {
            doctorSelect.innerHTML = `<option value="">No doctors added</option>`;
            return;
        }

        filteredDoctors.forEach(function(doctor) {
            const option = document.createElement("option");
            option.value = doctor.id;
            option.textContent = doctor.name;
            option.dataset.name = doctor.name;
            doctorSelect.appendChild(option);
        });

        doctorSelect.disabled = false;
    } catch (error) {
        console.error("Doctor error:", error);
        doctorSelect.innerHTML = `<option value="">Cannot load doctors</option>`;
        showQueueMessage(error.message, false);
    }
}

/* Get selected doctor name */
function getSelectedDoctorName() {
    const doctorSelect = document.getElementById("queueDoctor");
    const selectedOption = doctorSelect.options[doctorSelect.selectedIndex];

    if (!selectedOption || !selectedOption.value) return "";

    return selectedOption.dataset.name || selectedOption.textContent || "";
}

/*
 * Load patients.
 * silent=true is used for automatic refresh.
 * Automatic refresh does not replace the table with a loading message.
 */
async function loadPatients(silent = false) {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();
    const tableBody = document.getElementById("patientTableBody");

    if (!department || !doctor) {
        clearPatients();
        return;
    }

    /* Do not start another request while one is already running. */
    if (isLoadingPatients) return;

    isLoadingPatients = true;

    /* Show the loading message only for manual/initial loads. */
    if (!silent) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="6" style="padding:20px;text-align:center;">
                    Loading patients...
                </td>
            </tr>
        `;
    }

    try {
        const response = await fetch(`${API}/tokens`);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to load tokens.");
        }

        const tokens = Array.isArray(data) ? data : (data.tokens || []);
        const hospital = await getCurrentHospital();

        /* Keep only this hospital's active tokens for the selected doctor. */
        const hospitalTokens = tokens.filter(function(token) {
            const correctHospital =
                token.hospital_id !== undefined && token.hospital_id !== null
                    ? Number(token.hospital_id) === Number(hospital.id)
                    : token.hospital === hospital.name;

            const status = String(token.status || "").toLowerCase();

            return (
                correctHospital &&
                token.department === department &&
                token.doctor === doctor &&
                ["waiting", "serving"].includes(status)
            );
        });

        /* Sort by token number. */
        hospitalTokens.sort(function(a, b) {
            return Number(a.token_number || 0) - Number(b.token_number || 0);
        });

        if (hospitalTokens.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" style="padding:20px;text-align:center;">
                        No patients waiting for this doctor.
                    </td>
                </tr>
            `;
            return;
        }

        /* Build the updated table only after the data is ready. */
        const fragment = document.createDocumentFragment();

        hospitalTokens.forEach(function(token) {
            const row = document.createElement("tr");
            const status = String(token.status || "").toLowerCase();

            const completeButtonHtml =
                !["completed", "cancelled"].includes(status)
                    ? `<button
                        onclick="completePatientToken(${Number(token.id)})"
                        style="background:#16a34a;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">
                        Complete
                       </button>`
                    : "—";

            row.innerHTML = `
                <td style="padding:12px;"><strong>${escapeHTML(token.token_number)}</strong></td>
                <td style="padding:12px;">${escapeHTML(token.patient_name)}</td>
                <td style="padding:12px;">${escapeHTML(token.department)}</td>
                <td style="padding:12px;">${escapeHTML(token.doctor)}</td>
                <td style="padding:12px;">${getStatusText(token.status)}</td>
                <td style="padding:12px;">${completeButtonHtml}</td>
            `;

            fragment.appendChild(row);
        });

        tableBody.replaceChildren(fragment);
    } catch (error) {
        console.error("Patient queue error:", error);

        /*
         * Keep existing rows during automatic refresh failures.
         * Show the error in the table for a manual refresh.
         */
        if (!silent) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" style="padding:20px;text-align:center;">
                        Cannot load patient queue.<br><br>
                        ${escapeHTML(error.message)}
                    </td>
                </tr>
            `;
        }
    } finally {
        isLoadingPatients = false;
    }
}

/* Call next patient */
async function callNextPatient() {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();

    if (!department) {
        alert("Please select a department.");
        return;
    }

    if (!doctor) {
        alert("Please select a doctor.");
        return;
    }

    const button = document.getElementById("nextPatientButton");
    button.disabled = true;
    button.textContent = "Calling...";

    try {
        const response = await fetch(`${API}/next-patient`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                hospital_id: Number(hospitalId),
                department: department,
                doctor: doctor
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to call next patient.");
        }

        if (data.token_number !== undefined && data.token_number !== null) {
            const patientName = data.patient_name || data.patient || "Patient";
            showCurrentPatient(data.token_number, patientName);

            alert(
                "📢 Patient Called\n\nToken: " + data.token_number +
                "\nPatient: " + patientName
            );
        } else if (data.token !== undefined && data.token !== null) {
            const patientName = data.patient || "Patient";
            showCurrentPatient(data.token, patientName);

            alert(
                "📢 Patient Called\n\nToken: " + data.token +
                "\nPatient: " + patientName
            );
        } else {
            alert(data.message || "No waiting patients.");
        }

        await loadPatients();
    } catch (error) {
        console.error("Call next patient error:", error);
        alert(error.message || "Unable to call next patient.");
    } finally {
        button.disabled = false;
        button.textContent = "📢 Call Next Patient";
    }
}

/* Complete patient token */
async function completePatientToken(tokenId) {
    if (!tokenId || !Number.isFinite(Number(tokenId))) {
        alert("Invalid token ID.");
        return;
    }

    if (!confirm("Mark this patient as completed?")) return;

    try {
       const response = await fetch(`${API}/tokens/${tokenId}/complete`, {
    method: "PUT"
});

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Unable to complete token.");
        }

        alert(data.message || "Patient token completed successfully.");
        await loadPatients();
    } catch (error) {
        console.error("Complete token error:", error);
        alert(error.message || "Unable to complete patient token.");
    }
}

/* Current patient display */
function showCurrentPatient(token, patient) {
    const box = document.getElementById("currentPatient");
    const text = document.getElementById("currentPatientText");

    text.innerHTML = `
        <strong>Token:</strong> ${escapeHTML(token)}
        <br>
        <strong>Patient:</strong> ${escapeHTML(patient)}
    `;

    box.style.display = "block";
}

/* Clear patient list */
function clearPatients() {
    const tableBody = document.getElementById("patientTableBody");

    tableBody.innerHTML = `
        <tr>
            <td colspan="6" style="padding:20px;text-align:center;">
                Select a department and doctor.
            </td>
        </tr>
    `;

    document.getElementById("currentPatient").style.display = "none";
}

/* Status labels */
function getStatusText(status) {
    const normalized = String(status || "").toLowerCase();

    if (normalized === "waiting") return "🟡 Waiting";
    if (normalized === "serving") return "🟢 Serving";
    if (normalized === "completed") return "✅ Completed";
    if (normalized === "cancelled") return "🔴 Cancelled";

    return escapeHTML(status || "Unknown");
}

/* Escape HTML */
function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* Queue message */
function showQueueMessage(message, success) {
    const element = document.getElementById("queueMessage");

    element.textContent = message;
    element.style.display = "block";
    element.style.background = success ? "#dcfce7" : "#fee2e2";
    element.style.color = success ? "#166534" : "#991b1b";
}

/* Dashboard */
function goDashboard() {
    window.location.href = "dashboard.html";
}

/* Hospital logout */
function hospitalLogout() {
    [
        "hospital_id",
        "hospital_name",
        "hospital_email",
        "hospital_token_fee",
        "hospital_approval_status",
        "hospital_is_published",
        "hospital_latitude",
        "hospital_longitude",
        "hospitalLoggedIn"
    ].forEach(function(key) {
        localStorage.removeItem(key);
    });

    window.location.href = "index.html";
}

/* Initial load */
loadQueueDepartments();

/*
 * Automatic refresh every 5 seconds.
 * Silent mode keeps the current table visible while updating.
 */
setInterval(function() {
    const department = document.getElementById("queueDepartment").value;
    const doctor = getSelectedDoctorName();

    if (department && doctor && !document.hidden) {
        loadPatients(true);
    }
}, 5000);

</script>
</body>
</html>
