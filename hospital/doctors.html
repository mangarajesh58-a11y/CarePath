```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctors</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="page-container">

    <header>

        <div>

            <h1>👨‍⚕️ Doctors</h1>

            <p>
                Manage Hospital Doctors
            </p>

        </div>

        <button
            class="back-button"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </header>


    <div class="form-card">

        <h2>
            Add Doctor
        </h2>


        <label>
            Doctor Name
        </label>

        <input
            type="text"
            id="doctorName"
            placeholder="Enter doctor name"
        >


        <label>
            Department
        </label>

        <select id="doctorDepartment">

            <option value="">
                Select Department
            </option>

            <option>
                General Medicine
            </option>

            <option>
                Cardiology
            </option>

            <option>
                Orthopedics
            </option>

            <option>
                Pediatrics
            </option>

            <option>
                Dermatology
            </option>

        </select>


        <label>
            Experience
        </label>

        <input
            type="text"
            id="doctorExperience"
            placeholder="Example: 8 years"
        >


        <button
            onclick="addDoctor()"
        >
            Add Doctor
        </button>

    </div>


    <div class="list-card">

        <h2>
            Doctors List
        </h2>

        <div id="doctorList">

            <p>
                No doctors added yet.
            </p>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
```
