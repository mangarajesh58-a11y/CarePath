<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Doctors - HospitalCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <header>
        <div>
            <h1>🏥 HospitalCare</h1>
            <p>Doctor Management</p>
        </div>

        <button class="logout" onclick="hospitalLogout()">
            Logout
        </button>
    </header>


    <!-- PAGE TITLE -->
    <div class="welcome">

        <h2>Manage Doctors</h2>

        <p>
            Add and manage doctors belonging to your hospital.
        </p>

    </div>


    <!-- ADD DOCTOR -->
    <div class="form-card">

        <h2>➕ Add Doctor</h2>

        <label for="doctorName">
            Doctor Name
        </label>

        <input
            type="text"
            id="doctorName"
            placeholder="Example: Dr. Kumar"
        >


        <label for="doctorDepartment">
            Department
        </label>

        <input
            type="text"
            id="doctorDepartment"
            placeholder="Example: Cardiology"
        >


        <label for="doctorExperience">
            Experience
        </label>

        <input
            type="text"
            id="doctorExperience"
            placeholder="Example: 8 years"
        >


        <button onclick="addDoctor()">
            Add Doctor
        </button>

    </div>


    <!-- SEPARATE DOCTOR LIST -->
    <div class="list-card">

        <h2>👨‍⚕️ Your Hospital Doctors</h2>

        <div id="doctorList">

            <p>
                Loading doctors...
            </p>

        </div>

    </div>


    <!-- BACK -->
    <button
        class="back-button"
        onclick="goDashboard()"
    >
        ← Back to Dashboard
    </button>

</div>


<script src="script.js"></script>

</body>

</html>
