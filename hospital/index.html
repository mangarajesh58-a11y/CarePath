<!DOCTYPE html>
<html lang="en">

<head>
<script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HospitalCare - Hospital Login</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* =========================
           LOGIN PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(33, 150, 243, 0.15),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(124, 58, 237, 0.15),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #f8f3ff
                );

            min-height: 100vh;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 520px;

            margin: 0 auto;

            padding: 50px 20px;
        }


        /* =========================
           LOGO SECTION
        ========================= */

        .logo-section {
            text-align: center;

            margin-bottom: 30px;
        }


        .logo {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #7c3aed
                );

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 45px;

            box-shadow:
                0 12px 30px
                rgba(37, 99, 235, 0.25);
        }


        .logo-section h1 {
            margin-top: 18px;

            margin-bottom: 6px;

            font-size: 32px;

            background:
                linear-gradient(
                    90deg,
                    #1976d2,
                    #7c3aed
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .logo-section p {
            margin: 0;

            color: #64748b;

            font-size: 16px;

            font-weight: 500;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {

            background: rgba(255, 255, 255, 0.96);

            padding: 32px;

            border-radius: 20px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 20px 50px
                rgba(37, 99, 235, 0.12);
        }


        .login-card h2 {

            margin-top: 0;

            margin-bottom: 25px;

            color: #172554;

            font-size: 25px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #334155;

            font-size: 14px;
        }


        .form-group input {

            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 2px solid #e2e8f0;

            border-radius: 10px;

            background: #f8fafc;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }


        .form-group input:hover {

            border-color: #93c5fd;
        }


        .form-group input:focus {

            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.10);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #7c3aed
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }


        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.25);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* =========================
           OR SEPARATOR
        ========================= */

        .or-separator {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            margin: 22px 0;

            color: #777;

            font-size: 14px;

            font-weight: 500;
        }


        .or-separator::before,
        .or-separator::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e2e8f0;
        }


        .or-separator span {

            padding: 0 15px;

            background: white;

            color: #64748b;

            font-weight: bold;
        }


        /* =========================
           GOOGLE BUTTON
        ========================= */

        .google-button {

            width: 100%;

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            background: white;

            border: 2px solid #e2e8f0;

            border-radius: 10px;

            color: #334155;

            font-size: 15px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.25s;
        }


        .google-button:hover {

            background: #f8fafc;

            border-color: #cbd5e1;

            transform: translateY(-1px);
        }


        .google-icon {

            font-size: 21px;

            font-weight: bold;

            color: #4285f4;
        }


        /* =========================
           REGISTER
        ========================= */

        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }


        .register-text a {

            color: #1976d2;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {

            text-decoration: underline;
        }


        /* =========================
           HOSPITAL ICON INFO
        ========================= */

        .portal-info {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 12px;

            color: #64748b;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .login-container {

                margin: 0 auto;

                padding: 35px 15px;
            }


            .login-card {

                padding: 25px 20px;

                border-radius: 18px;
            }


            .logo {

                width: 78px;

                height: 78px;

                font-size: 38px;

                border-radius: 22px;
            }


            .logo-section h1 {

                font-size: 28px;
            }


            .logo-section p {

                font-size: 15px;
            }


            .login-card h2 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LOGIN CONTAINER
    ========================= -->

    <div class="login-container">


        <!-- =========================
             HOSPITAL LOGO
        ========================= -->

        <div class="logo-section">


            <div class="logo">

                🏥

            </div>


            <h1>

                HospitalCare

            </h1>


            <p>

                Hospital Portal

            </p>


            <div class="portal-info">

                🏥
                <span>
                    Manage your hospital
                </span>

            </div>


        </div>



        <!-- =========================
             LOGIN CARD
        ========================= -->

        <div class="login-card">


            <h2>

                Hospital Login

            </h2>



            <!-- =========================
                 EMAIL
            ========================= -->

            <div class="form-group">


                <label for="loginEmail">

                    Email

                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >


            </div>



            <!-- =========================
                 PASSWORD
            ========================= -->

            <div class="form-group">


                <label for="loginPassword">

                    Password

                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >


            </div>



            <!-- =========================
                 LOGIN BUTTON
            ========================= -->

            <button
                type="button"
                class="login-button"
                onclick="hospitalLogin()"
            >

                Login

            </button>



            <!-- =========================
                 OR
            ========================= -->

            <div class="or-separator">

                <span>

                    OR

                </span>

            </div>



            <!-- =========================
                 GOOGLE LOGIN
            ========================= -->

            <div class="google-button-container">
           <div id="googleButton"></div>
         </div>



            <!-- =========================
                 REGISTER
            ========================= -->

            <p class="register-text">


                Don't have a hospital account?


                <a href="register.html">

                    Register

                </a>


            </p>


        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

     <script src="script.js"></script>

<script>
    window.onload = function () {

        if (
            typeof google !== "undefined" &&
            document.getElementById("googleButton")
        ) {

            google.accounts.id.initialize({

                client_id:
                    "124194505435-5rpj0kjdj3fgkle4vhp18gg89qs4he3l.apps.googleusercontent.com",

                callback:
                    handleHospitalGoogleLogin
            });


            google.accounts.id.renderButton(

                document.getElementById("googleButton"),

                {
                    theme: "outline",
                    size: "large",
                    width: 400,
                    text: "continue_with",
                    shape: "rectangular"
                }

            );

        }

    };
</script>

</body>

</html>
