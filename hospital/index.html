
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospital Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="auth-container">

    <div class="logo">
        🏥
    </div>

    <h1>HospitalCare</h1>

    <p class="subtitle">
        Hospital / Doctor Login
    </p>


    <div class="form-card">

        <label>
            Hospital Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter hospital email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >


        <button onclick="hospitalLogin()">
            Login
        </button>


        <p class="register-text">

            Don't have a hospital account?

            <a href="register.html">
                Register Hospital
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
