<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HospitalCare - Hospital Login</title>


    <!-- =====================================================
         GOOGLE IDENTITY SERVICES
    ====================================================== -->

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>


    <!-- =====================================================
         HOSPITAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(33, 150, 243, 0.15),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(124, 58, 237, 0.15),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #eef7ff,
                    #f8f3ff
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login-container {

            width: 100%;

            max-width: 520px;

            padding: 40px 20px;
        }


        /* =================================================
           LOGO
        ================================================= */

        .logo-section {

            text-align: center;

            margin-bottom: 30px;
        }


        .logo {

            width: 90px;

            height: 90px;

            margin: auto;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #7c3aed
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 45px;

            box-shadow:
                0 12px 30px
                rgba(
                    37,
                    99,
                    235,
                    0.25
                );
        }


        .logo-section h1 {

            margin-top: 18px;

            margin-bottom: 6px;

            font-size: 32px;

            background:
                linear-gradient(
                    90deg,
                    #1976d2,
                    #7c3aed
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }


        .logo-section p {

            margin: 0;

            color: #64748b;

            font-size: 16px;

            font-weight: 500;
        }


        .portal-info {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 12px;

            color: #64748b;

            font-size: 13px;
        }


        /* =================================================
           LOGIN CARD
        ================================================= */

        .login-card {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            padding: 32px;

            border-radius: 20px;

            border:
                1px solid #e2e8f0;

            box-shadow:
                0 20px 50px
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );
        }


        .login-card h2 {

            margin-top: 0;

            margin-bottom: 25px;

            color: #172554;

            font-size: 25px;
        }


        /* =================================================
           FORM
        ================================================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #334155;

            font-size: 14px;
        }


        .form-group input {

            width: 100%;

            height: 50px;

            padding:
                0 14px;

            border:
                2px solid #e2e8f0;

            border-radius: 10px;

            background: #f8fafc;

            font-size: 15px;

            outline: none;

            transition:
                0.25s;
        }


        .form-group input:hover {

            border-color:
                #93c5fd;
        }


        .form-group input:focus {

            border-color:
                #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(
                    99,
                    102,
                    241,
                    0.10
                );
        }


        /* =================================================
           LOGIN BUTTON
        ================================================= */

        .login-button {

            width: 100%;

            height: 52px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1976d2,
                    #7c3aed
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.25s;
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(
                    79,
                    70,
                    229,
                    0.25
                );
        }


        .login-button:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        #message {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            min-height: 20px;
        }


        .success-message {

            color:
                #15803d;
        }


        .error-message {

            color:
                #dc2626;
        }


        /* =================================================
           OR SEPARATOR
        ================================================= */

        .or-separator {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            margin:
                22px 0;

            color: #777;

            font-size: 14px;

            font-weight: 500;
        }


        .or-separator::before,
        .or-separator::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                #e2e8f0;
        }


        .or-separator span {

            padding:
                0 15px;

            background:
                white;

            color:
                #64748b;

            font-weight:
                bold;
        }


        /* =================================================
           GOOGLE BUTTON
        ================================================= */

        .google-button-container {

            width: 100%;

            min-height: 44px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        #googleButton {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =================================================
           REGISTER
        ================================================= */

        .register-link {

            margin-top: 20px;

            text-align: center;

            color:
                #64748b;

            font-size: 14px;
        }


        .register-link a {

            color:
                #1976d2;

            text-decoration:
                none;

            font-weight:
                bold;
        }


        .register-link a:hover {

            text-decoration:
                underline;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            body {

                align-items:
                    flex-start;
            }


            .login-container {

                padding:
                    35px 15px;
            }


            .login-card {

                padding:
                    25px 20px;

                border-radius:
                    18px;
            }


            .logo {

                width:
                    78px;

                height:
                    78px;

                font-size:
                    38px;

                border-radius:
                    22px;
            }


            .logo-section h1 {

                font-size:
                    28px;
            }


            .logo-section p {

                font-size:
                    15px;
            }


            .login-card h2 {

                font-size:
                    22px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- =================================================
         LOGO SECTION
    ================================================== -->

    <div class="logo-section">


        <div class="logo">

            🏥

        </div>


        <h1>

            HospitalCare

        </h1>


        <p>

            Hospital Portal

        </p>


        <div class="portal-info">

            <span>
                🏥
            </span>

            <span>
                Manage your hospital
            </span>

        </div>


    </div>



    <!-- =================================================
         LOGIN CARD
    ================================================== -->

    <div class="login-card">


        <h2>

            Hospital Login

        </h2>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            id="hospitalLoginForm"
        >


            <div class="form-group">


                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


            </div>



            <div class="form-group">


                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


            </div>



            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                Login

            </button>


        </form>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
        ></div>



        <!-- =================================================
             GOOGLE SEPARATOR
        ================================================== -->

        <div class="or-separator">

            <span>

                OR

            </span>

        </div>



        <!-- =================================================
             GOOGLE LOGIN
        ================================================== -->

        <div
            class="google-button-container"
        >

            <div
                id="googleButton"
            ></div>

        </div>



        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register-link">

            Don't have a hospital account?

            <a href="register.html">

                Register Hospital

            </a>

        </div>


    </div>


</div>



<!-- =====================================================
     HOSPITAL JAVASCRIPT
====================================================== -->

<script src="script.js"></script>



<!-- =====================================================
     GOOGLE LOGIN
====================================================== -->

<script>


/*
 * IMPORTANT
 *
 * This Client ID must be the same Web OAuth Client ID
 * configured in Google Cloud Console and used by your
 * backend GOOGLE_CLIENT_ID environment variable.
 */

const GOOGLE_CLIENT_ID =
    "124194505435-nirpgumce4ek0f368mjnkm8daq5dof9p.apps.googleusercontent.com"


/* =====================================================
   GOOGLE LOGIN CALLBACK
===================================================== */

async function handleHospitalGoogleLogin(
    response
) {

    console.log(
        "Google Hospital Login Response:",
        response
    );


    if (
        !response ||
        !response.credential
    ) {

        showMessage(
            "Google login failed. No credential received.",
            "error"
        );

        return;
    }


    try {


        showMessage(
            "Signing in with Google...",
            "success"
        );


        /*
         * Send Google credential to FastAPI
         */

        const result =
            await fetch(
                "http://127.0.0.1:8000/hospitals/google-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            credential:
                                response.credential

                        })
                }
            );


        const data =
            await result.json();


        console.log(
            "Google Backend Response:",
            data
        );


        if (!result.ok) {

            throw new Error(
                data.detail ||
                "Google hospital login failed."
            );
        }


        /*
         * Backend may return hospital directly
         * or inside a hospital property.
         */

        const hospital =
            data.hospital ||
            data;


        if (
            !hospital ||
            !hospital.id
        ) {

            throw new Error(
                "Hospital information was not returned by the server."
            );
        }


        /*
         * Save hospital information
         */

        localStorage.setItem(
            "hospital",
            JSON.stringify(hospital)
        );


        localStorage.setItem(
            "hospital_id",
            hospital.id
        );


        /*
         * Success
         */

        showMessage(
            "Google login successful. Redirecting...",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "dashboard.html";

            },
            700
        );


    }
    catch (error) {


        console.error(
            "GOOGLE HOSPITAL LOGIN ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Google login failed.",
            "error"
        );

    }

}



/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(
    message,
    type
) {

    const messageElement =
        document.getElementById(
            "message"
        );


    if (!messageElement) {

        return;
    }


    messageElement.textContent =
        message;


    messageElement.className =
        type === "success"
            ? "success-message"
            : "error-message";
}



/* =====================================================
   INITIALIZE GOOGLE
===================================================== */

function initializeHospitalGoogleLogin() {


    const googleButton =
        document.getElementById(
            "googleButton"
        );


    if (!googleButton) {

        console.error(
            "Google button container not found."
        );

        return;
    }



    /*
     * Google Identity Services may load
     * slightly after this page.
     */

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.id
    ) {

        console.log(
            "Google Identity Services is not ready. Retrying..."
        );


        setTimeout(
            initializeHospitalGoogleLogin,
            500
        );


        return;
    }



    /*
     * Initialize Google
     */

    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleHospitalGoogleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            true

    });



    /*
     * Clear previous button
     */

    googleButton.innerHTML = "";



    /*
     * Render Google button
     */

    google.accounts.id.renderButton(

        googleButton,

        {

            type:
                "standard",

            theme:
                "outline",

            size:
                "large",

            text:
                "continue_with",

            shape:
                "rectangular",

            width:
                400

        }

    );


    console.log(
        "Google Hospital Login button rendered successfully."
    );

}



/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function () {

        initializeHospitalGoogleLogin();

    }
);


</script>


</body>

</html>
