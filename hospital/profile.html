<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospital Profile - HospitalCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="page-container">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header>

        <div>

            <h1>
                🏥 Hospital Profile
            </h1>

            <p>
                Manage Hospital Information
            </p>

        </div>


        <button
            class="logout"
            onclick="hospitalLogout()"
        >
            Logout
        </button>

    </header>



    <!-- ==================================================
         HOSPITAL INFORMATION
    =================================================== -->

    <div class="form-card">

        <h2>
            Hospital Information
        </h2>


        <!-- HOSPITAL NAME -->

        <label for="profileName">
            Hospital Name
        </label>

        <input
            type="text"
            id="profileName"
            placeholder="Enter hospital name"
        >


        <!-- EMAIL -->

        <label for="profileEmail">
            Hospital Email
        </label>

        <input
            type="email"
            id="profileEmail"
            placeholder="Enter hospital email"
        >


        <!-- PHONE -->

        <label for="profilePhone">
            Phone Number
        </label>

        <input
            type="tel"
            id="profilePhone"
            placeholder="Enter phone number"
        >


        <!-- CITY -->

        <label for="profileCity">
            City
        </label>

        <input
            type="text"
            id="profileCity"
            placeholder="Enter city"
        >


        <!-- ADDRESS -->

        <label for="profileAddress">
            Hospital Address
        </label>

        <textarea
            id="profileAddress"
            placeholder="Enter complete hospital address"
            rows="4"
        ></textarea>


        <!-- DESCRIPTION -->

        <label for="profileDescription">
            Hospital Description
        </label>

        <textarea
            id="profileDescription"
            placeholder="Describe your hospital"
            rows="4"
        ></textarea>


        <!-- LICENSE -->

        <label for="profileLicense">
            Registration / License Number
        </label>

        <input
            type="text"
            id="profileLicense"
            placeholder="Enter registration number"
        >


        <!-- ==================================================
             TOKEN FEE
        =================================================== -->

        <label for="profileTokenFee">
            Token Fee
        </label>

        <input
            type="number"
            id="profileTokenFee"
            placeholder="Enter token fee"
            min="0"
            step="1"
        >

        <p
            style="
                margin-top:8px;
                color:#666;
                font-size:14px;
                line-height:1.5;
            "
        >
            Set the amount patients must pay for
            a hospital token.
            The QueueLess platform fee is added
            separately.
        </p>


        <!-- SAVE -->

        <button
            type="button"
            onclick="saveProfile()"
        >

            💾 Save Changes

        </button>


    </div>



    <!-- ==================================================
         HOSPITAL LOCATION
    =================================================== -->

    <div class="form-card">

        <h2>
            📍 Hospital Location
        </h2>


        <p
            style="
                color:#666;
                margin-bottom:15px;
            "
        >
            Select your hospital location.
        </p>


        <!-- MAP -->

        <div
            id="map"
            style="
                width:100%;
                height:350px;
                border-radius:12px;
                background:#e5e7eb;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#666;
            "
        >

            Google Maps will appear here.

        </div>


        <!-- LATITUDE / LONGITUDE -->

        <div
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:15px;
                margin-top:20px;
            "
        >


            <!-- LATITUDE -->

            <div>

                <label>
                    Latitude
                </label>

                <p
                    id="latitude"
                    style="
                        padding:12px;
                        background:#f5f9ff;
                        border-radius:8px;
                    "
                >
                    Not selected
                </p>

            </div>


            <!-- LONGITUDE -->

            <div>

                <label>
                    Longitude
                </label>

                <p
                    id="longitude"
                    style="
                        padding:12px;
                        background:#f5f9ff;
                        border-radius:8px;
                    "
                >
                    Not selected
                </p>

            </div>


        </div>


    </div>



    <!-- ==================================================
         BACK TO DASHBOARD
    =================================================== -->

    <button
        class="back-button"
        onclick="goDashboard()"
    >

        ← Back to Dashboard

    </button>


</div>



<!-- ==================================================
     HOSPITAL JAVASCRIPT
================================================== -->

<script src="script.js"></script>



<!-- ==================================================
     GOOGLE MAPS
     
     Replace YOUR_GOOGLE_MAPS_API_KEY with your own
     Google Maps API key.
================================================== -->

<script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"
    async
    defer
></script>


</body>

</html>
