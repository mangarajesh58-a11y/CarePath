<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospital Registration - HospitalCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="auth-container">

    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">
        🏥
    </div>


    <h1>
        HospitalCare
    </h1>


    <p class="subtitle">
        Register Your Hospital
    </p>


    <!-- =========================
         REGISTRATION FORM
    ========================== -->

    <div class="form-card">

        <h2>
            Hospital Registration
        </h2>


        <!-- HOSPITAL NAME -->

        <label for="hospitalName">
            Hospital Name
        </label>

        <input
            type="text"
            id="hospitalName"
            placeholder="Enter hospital name"
            autocomplete="organization"
        >


        <!-- EMAIL -->

        <label for="hospitalEmail">
            Hospital Email
        </label>

        <input
            type="email"
            id="hospitalEmail"
            placeholder="Enter hospital email"
            autocomplete="email"
        >


        <!-- PHONE -->

        <label for="hospitalPhone">
            Phone Number
        </label>

        <input
            type="tel"
            id="hospitalPhone"
            placeholder="Enter phone number"
            autocomplete="tel"
        >


        <!-- CITY -->

        <label for="hospitalCity">
            City
        </label>

        <input
            type="text"
            id="hospitalCity"
            placeholder="Enter city"
        >


        <!-- ADDRESS -->

        <label for="hospitalAddress">
            Hospital Address
        </label>

        <textarea
            id="hospitalAddress"
            placeholder="Enter complete hospital address"
            rows="4"
        ></textarea>


        <!-- DESCRIPTION -->

        <label for="hospitalDescription">
            Hospital Description
        </label>

        <textarea
            id="hospitalDescription"
            placeholder="Enter hospital description"
            rows="4"
        ></textarea>


        

        <!-- LICENSE -->

    <label for="licenseId">
    Hospital License ID
    </label>

    <input
        type="text"
        id="licenseId"
        placeholder="Enter hospital license ID"
        required
    >


        <!-- PASSWORD -->

        <label for="hospitalPassword">
            Password
        </label>

        <input
            type="password"
            id="hospitalPassword"
            placeholder="Create password"
            autocomplete="new-password"
        >


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
        >


        <!-- REGISTER -->

        <button
            type="button"
            onclick="registerHospital()"
        >
            Register Hospital
        </button>


        <!-- MESSAGE -->

        <p
            id="registerMessage"
            class="message"
        ></p>


        <!-- LOGIN -->

        <p class="register-text">

            Already registered?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
