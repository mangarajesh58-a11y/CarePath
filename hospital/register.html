
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registration - CarePath</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            color: #1976d2;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background: #125ca3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
            line-height: 1.5;
            min-height: 24px;
            overflow-wrap: anywhere;
            white-space: pre-line;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        .hint {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }

        .otp-panel {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            background: #eff6ff;
        }

        .otp-panel h3 {
            margin-bottom: 8px;
            color: #1d4ed8;
            text-align: center;
        }

        .otp-panel p {
            margin-bottom: 12px;
            color: #475569;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .otp-actions {
            display: flex;
            gap: 10px;
        }

        .otp-actions button {
            flex: 1;
        }

        .secondary-button {
            background: #64748b;
        }

        .secondary-button:hover:not(:disabled) {
            background: #475569;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                margin-top: 20px;
                padding: 25px 20px;
            }

            .logo {
                font-size: 26px;
            }

            h2 {
                font-size: 22px;
            }

            .otp-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🏥 CarePath</div>

    <p class="subtitle">
        Register your hospital with CarePath
    </p>

    <h2>Hospital Registration</h2>

    <form id="hospitalRegisterForm" enctype="multipart/form-data">

        <div class="form-group">
            <label for="name">Hospital Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter hospital name"
                autocomplete="organization"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Hospital Email</label>
            <input
                type="email"
                id="email"
                placeholder="hospital@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                autocomplete="tel"
                required
            >
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input
                type="text"
                id="city"
                placeholder="Enter city"
                required
            >
        </div>

        <div class="form-group">
            <label for="address">Hospital Address</label>
            <textarea
                id="address"
                placeholder="Enter complete hospital address"
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="description">Hospital Description</label>
            <textarea
                id="description"
                placeholder="Enter hospital description"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="registration_number">
                Hospital Registration / License Number
            </label>
            <input
                type="text"
                id="registration_number"
                placeholder="Enter registration / license number"
                required
            >
        </div>

        <div class="form-group">
            <label for="issuing_authority">Issuing Authority</label>
            <input
                type="text"
                id="issuing_authority"
                placeholder="Example: DM&HO / Health Department"
                required
            >
        </div>

        <div class="form-group">
            <label for="license_expiry_date">License Expiry Date</label>
            <input
                type="date"
                id="license_expiry_date"
            >
        </div>

        <div class="form-group">
            <label for="license_certificate">
                Hospital Registration Certificate
            </label>
            <input
                type="file"
                id="license_certificate"
                accept=".pdf,.jpg,.jpeg,.png"
                required
            >
            <span class="hint">
                Accepted formats: PDF, JPG, JPEG, PNG. Maximum size: 10 MB.
            </span>
        </div>

        <div class="form-group">
            <label for="token_fee">Token Fee (₹)</label>
            <input
                type="number"
                id="token_fee"
                min="0"
                step="1"
                value="0"
                placeholder="Example: 100"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                placeholder="Confirm password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" id="registerButton">
            Send Email OTP
        </button>

        <div id="otpPanel" class="otp-panel">
            <h3>Verify Hospital Email</h3>

            <p id="otpInstructions">
                Enter the verification code sent to your hospital email.
            </p>

            <div class="form-group">
                <label for="emailOtp">Email OTP</label>
                <input
                    type="text"
                    id="emailOtp"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="Enter 6-digit OTP"
                >
            </div>

            <div class="otp-actions">
                <button type="button" id="verifyOtpButton">
                    Verify OTP &amp; Register
                </button>

                <button
                    type="button"
                    id="resendOtpButton"
                    class="secondary-button"
                >
                    Resend OTP
                </button>
            </div>
        </div>

        <div id="message" aria-live="polite"></div>

    </form>

    <div class="login-link">
        Already registered?
        <a href="index.html">Hospital Login</a>
    </div>

</div>

<script>
"use strict";

/* Backend URL */
const API_URL = "https://carepath-backend-fgb9.onrender.com";

/* Page elements */
const form = document.getElementById("hospitalRegisterForm");
const message = document.getElementById("message");
const registerButton = document.getElementById("registerButton");
const otpPanel = document.getElementById("otpPanel");
const emailOtpInput = document.getElementById("emailOtp");
const verifyOtpButton = document.getElementById("verifyOtpButton");
const resendOtpButton = document.getElementById("resendOtpButton");

/* Registration state */
let pendingFormData = null;
let pendingEmail = "";
let otpRequested = false;
let otpVerified = false;
let isRegistering = false;

/* Display success and error messages */
function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = type;
}

/* Get trimmed form value */
function getValue(id) {
    return document.getElementById(id).value.trim();
}

/* Disable registration fields while OTP is pending */
function setFormFieldsDisabled(disabled) {
    const fields = form.querySelectorAll(
        "input:not(#emailOtp), textarea"
    );

    fields.forEach(function(field) {
        field.disabled = disabled;
    });
}

/* Build the hospital registration data */
function buildRegistrationFormData() {
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirm_password").value;

    const certificate =
        document.getElementById("license_certificate").files[0];

    const tokenFee = Number(
        document.getElementById("token_fee").value
    );

    if (!getValue("name")) {
        throw new Error("Please enter the hospital name.");
    }

    if (!getValue("email")) {
        throw new Error("Please enter the hospital email.");
    }

    if (password.length < 6) {
        throw new Error(
            "Password must contain at least 6 characters."
        );
    }

    if (password !== confirmPassword) {
        throw new Error("Passwords do not match.");
    }

    if (!Number.isFinite(tokenFee) || tokenFee < 0) {
        throw new Error("Please enter a valid token fee.");
    }

    if (!certificate) {
        throw new Error(
            "Please upload the hospital registration certificate."
        );
    }

    const allowedExtensions = /\.(pdf|jpe?g|png)$/i;

    if (!allowedExtensions.test(certificate.name)) {
        throw new Error(
            "Certificate must be a PDF, JPG, JPEG, or PNG file."
        );
    }

    if (certificate.size > 10 * 1024 * 1024) {
        throw new Error(
            "Certificate file must be 10 MB or smaller."
        );
    }

    const formData = new FormData();

    formData.append("name", getValue("name"));
    formData.append("email", getValue("email").toLowerCase());
    formData.append("phone", getValue("phone"));
    formData.append("city", getValue("city"));
    formData.append("address", getValue("address"));
    formData.append("description", getValue("description"));

    formData.append(
        "registration_number",
        getValue("registration_number")
    );

    formData.append(
        "issuing_authority",
        getValue("issuing_authority")
    );

    formData.append("password", password);
    formData.append("token_fee", String(tokenFee));
    formData.append("license_certificate", certificate);

    const expiryDate = document.getElementById(
        "license_expiry_date"
    ).value;

    if (expiryDate) {
        formData.append("license_expiry_date", expiryDate);
    }

    return formData;
}

/* Read API responses and display useful errors */
async function readResponse(response) {
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        let errorMessage =
            "Request failed (HTTP " + response.status + ").";

        if (Array.isArray(data.detail)) {
            errorMessage = data.detail.map(function(item) {
                const field = Array.isArray(item.loc)
                    ? item.loc[item.loc.length - 1]
                    : "";

                return field
                    ? field + ": " + item.msg
                    : item.msg;
            }).join("; ");

        } else if (typeof data.detail === "string") {
            errorMessage = data.detail;

        } else if (typeof data.message === "string") {
            errorMessage = data.message;
        }

        throw new Error(errorMessage);
    }

    return data;
}

/* Request email OTP */
async function requestOtp() {
    const email = getValue("email").toLowerCase();

    if (!email) {
        throw new Error(
            "Please enter the hospital email address."
        );
    }

    const response = await fetch(
        `${API_URL}/registration/request-otp`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                role: "hospital",
                email: email
            })
        }
    );

    const data = await readResponse(response);

    pendingEmail = email;
    otpRequested = true;
    otpVerified = false;

    otpPanel.style.display = "block";
    registerButton.style.display = "none";

    setFormFieldsDisabled(true);

    document.getElementById("otpInstructions").textContent =
        "A verification code was requested for " +
        pendingEmail +
        ". Enter the 6-digit code from that email.";

    emailOtpInput.value = "";
    emailOtpInput.required = true;
    emailOtpInput.focus();

    showMessage(
        data.message ||
        "OTP sent. Check your hospital email inbox and spam folder.",
        "success"
    );
}

/* Verify OTP and then submit hospital registration */
async function verifyOtpAndRegister() {
    if (!otpRequested || !pendingFormData || !pendingEmail) {
        throw new Error("Please request an email OTP first.");
    }

    if (isRegistering) {
        return;
    }

    isRegistering = true;

    try {
        if (!otpVerified) {
            const otp = emailOtpInput.value.trim();

            if (!/^\d{6}$/.test(otp)) {
                throw new Error(
                    "Enter the 6-digit OTP sent to your email."
                );
            }

            verifyOtpButton.textContent = "Verifying OTP...";

            const verifyResponse = await fetch(
                `${API_URL}/registration/verify-otp`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        role: "hospital",
                        email: pendingEmail,
                        otp: otp
                    })
                }
            );

            const verificationData =
                await readResponse(verifyResponse);

            if (verificationData.verified === false) {
                throw new Error(
                    verificationData.message ||
                    "OTP verification was not successful."
                );
            }

            otpVerified = true;
        }

        verifyOtpButton.textContent = "Registering Hospital...";

        showMessage(
            "Email verified. Creating hospital registration...",
            "success"
        );

        /*
         * The backend must independently enforce email verification
         * before allowing this registration request.
         */
        const registerResponse = await fetch(
            `${API_URL}/hospitals`,
            {
                method: "POST",
                body: pendingFormData
            }
        );

        const registrationData =
            await readResponse(registerResponse);

        showMessage(
            registrationData.message ||
            "Hospital registered successfully. Waiting for admin approval.",
            "success"
        );

        form.reset();

        otpPanel.style.display = "none";
        registerButton.style.display = "block";
        registerButton.textContent = "Send Email OTP";

        setFormFieldsDisabled(false);

        emailOtpInput.required = false;

        pendingFormData = null;
        pendingEmail = "";
        otpRequested = false;
        otpVerified = false;

    } finally {
        isRegistering = false;
    }
}

/* Initial form submission sends OTP */
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (otpRequested) {
        showMessage(
            "Enter the email OTP below and select Verify OTP & Register.",
            "error"
        );
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = "Sending OTP...";

    try {
        pendingFormData = buildRegistrationFormData();

        await requestOtp();

    } catch (error) {
        console.error("Hospital OTP request error:", error);

        showMessage(
            error instanceof TypeError
                ? "Cannot connect to FastAPI. Make sure the backend is running at " + API_URL
                : (error.message || "Could not send the verification OTP."),
            "error"
        );

    } finally {
        registerButton.disabled = false;

        if (!otpRequested) {
            registerButton.textContent = "Send Email OTP";
        }
    }
});

/* Verify OTP and register */
verifyOtpButton.addEventListener("click", async function() {
    if (isRegistering) {
        return;
    }

    verifyOtpButton.disabled = true;
    resendOtpButton.disabled = true;

    try {
        await verifyOtpAndRegister();

    } catch (error) {
        console.error(
            "Hospital OTP verification/registration error:",
            error
        );

        showMessage(
            error instanceof TypeError
                ? "Cannot connect to FastAPI. Make sure the backend is running at " + API_URL
                : (error.message || "OTP verification or registration failed."),
            "error"
        );

    } finally {
        verifyOtpButton.disabled = false;
        resendOtpButton.disabled = false;

        if (otpRequested) {
            verifyOtpButton.textContent = "Verify OTP & Register";
        }
    }
});

/* Resend OTP */
resendOtpButton.addEventListener("click", async function() {
    if (!pendingEmail || !otpRequested) {
        showMessage("Please request an OTP first.", "error");
        return;
    }

    resendOtpButton.disabled = true;
    resendOtpButton.textContent = "Sending...";

    try {
        const response = await fetch(
            `${API_URL}/registration/request-otp`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    role: "hospital",
                    email: pendingEmail
                })
            }
        );

        const data = await readResponse(response);

        emailOtpInput.value = "";
        otpVerified = false;

        showMessage(
            data.message ||
            "A new OTP was requested. Check your email.",
            "success"
        );

    } catch (error) {
        console.error("Resend OTP error:", error);

        showMessage(
            error instanceof TypeError
                ? "Cannot connect to FastAPI. Make sure the backend is running at " + API_URL
                : (error.message || "Could not resend OTP."),
            "error"
        );

    } finally {
        resendOtpButton.disabled = false;
        resendOtpButton.textContent = "Resend OTP";
    }
});
</script>in

</body>
</html>
