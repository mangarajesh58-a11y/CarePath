<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payments - CarePath</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="page-container">


    <!-- HEADER -->

    <header>

        <div>

            <h1>
                💳 Payments
            </h1>

            <p>
                CarePath payment records
            </p>

        </div>


        <button
            type="button"
            class="logout"
            onclick="adminLogout()"
        >
            Logout
        </button>

    </header>



    <!-- PAYMENT TABLE -->

    <div class="table-card">


        <!-- PAGE HEADING -->

        <div class="page-heading">

            <div>

                <h2>
                    Payment Records
                </h2>

                <p>
                    View token fees, platform fees and payment status
                </p>

            </div>


            <button
                type="button"
                onclick="loadPayments()"
            >
                🔄 Refresh
            </button>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Patient
                        </th>

                        <th>
                            Hospital
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Doctor
                        </th>

                        <th>
                            Token Fee
                        </th>

                        <th>
                            Platform Fee
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Payment Status
                        </th>

                        <th>
                            Razorpay Payment ID
                        </th>

                    </tr>

                </thead>


                <tbody id="paymentTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="loading"
                        >
                            Loading payments...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>



    <!-- BACK BUTTON -->

    <button
        type="button"
        class="back-button"
        onclick="goDashboard()"
    >
        ← Back to Dashboard
    </button>


</div>



<!-- ADMIN JAVASCRIPT -->

<script src="script.js"></script>

</body>

</html>
