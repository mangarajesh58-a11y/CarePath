<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tokens - HospitalCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="page-container">


        <header>

            <div>

                <h1>
                    🎫 Patient Tokens
                </h1>

                <p>
                    Monitor hospital token activity
                </p>

            </div>


            <button
                class="logout"
                onclick="adminLogout()"
            >
                Logout
            </button>

        </header>


        <div class="table-card">

            <div class="page-heading">

                <h2>
                    Token List
                </h2>

                <button
                    onclick="loadTokens()"
                >
                    🔄 Refresh
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Token
                            </th>

                            <th>
                                Patient
                            </th>

                            <th>
                                Hospital
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Doctor
                            </th>

                            <th>
                                Payment
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tokenTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="loading"
                            >
                                Loading tokens...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <button
            class="back-button"
            onclick="goDashboard()"
        >
            ← Back to Dashboard
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
