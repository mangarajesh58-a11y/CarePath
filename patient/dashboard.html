<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HospitalCare - Patient Dashboard</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>


    <div class="dashboard-container">


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="dashboard-header">

            <div>

                <h1>
                    🏥 HospitalCare
                </h1>

                <p>

                    Welcome,

                    <span id="patientName">
                        Patient
                    </span>

                </p>

            </div>


            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >

                Logout

            </button>

        </header>



        <!-- =========================================
             MAIN CONTENT
        ========================================== -->

        <main class="dashboard-content">


            <h2>
                Book Hospital Token
            </h2>


            <p>
                Select a hospital, department and doctor.
            </p>



            <!-- =====================================
                 HOSPITAL
            ====================================== -->

            <label for="hospital">

                Select Hospital

            </label>


            <select
                id="hospital"
            >

                <option value="">

                    Select Hospital

                </option>

            </select>



            <!-- =====================================
                 DEPARTMENT
            ====================================== -->

            <label for="department">

                Select Department

            </label>


            <select
                id="department"
                disabled
            >

                <option value="">

                    Select Department

                </option>

            </select>



            <!-- =====================================
                 DOCTOR
            ====================================== -->

            <label for="doctor">

                Select Doctor

            </label>


            <select
                id="doctor"
                disabled
            >

                <option value="">

                    Select Doctor

                </option>

            </select>



            <!-- =====================================
                 FEE
            ====================================== -->

            <div class="fee-box">


                <p>

                    Token Fee:

                    <span id="tokenFee">
                        ₹0
                    </span>

                </p>


                <p>

                    Platform Fee:

                    <span id="platformFee">
                        ₹10
                    </span>

                </p>


                <hr>


                <p>

                    <strong>

                        Total:

                        <span id="totalAmount">
                            ₹10
                        </span>

                    </strong>

                </p>


            </div>



            <!-- =====================================
                 MESSAGE
            ====================================== -->

            <div
                id="message"
                class="message"
            >
            </div>



            <!-- =====================================
                 PAYMENT BUTTON
            ====================================== -->

            <button
                type="button"
                id="continueBtn"
                disabled
            >

                💳 Continue & Pay ₹10

            </button>


        </main>


    </div>



    <!-- =========================================
         RAZORPAY
    ========================================== -->

    <script
        src="https://checkout.razorpay.com/v1/checkout.js">
    </script>


    <!-- =========================================
         PATIENT JAVASCRIPT
    ========================================== -->

    <script src="./script.js"></script>


</body>

</html>
