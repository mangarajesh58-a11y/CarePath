
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071329">

  <title>CarePath - Select Hospital</title>

  <link rel="stylesheet" href="./style.css">

  <!-- Load the dashboard JavaScript after HTML parsing -->
  <script src="./script.js" defer></script>
<script src="./dashboard-ui.js"></script>
</head>

<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">✚</span>

        <div>
          <h1>Select Hospital</h1>
          <p>
            Welcome,
            <span id="patientName">Patient</span>
          </p>
        </div>
      </div>

      <button
        type="button"
        id="logoutButton"
        class="icon-button"
        aria-label="Logout"
        title="Logout"
      >
        ⇥
      </button>
    </header>

    <!-- Main content -->
    <main class="page-content">

      <!-- Hospital search -->
      <section class="search-panel" aria-label="Search hospitals">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="hospitalSearch"
          type="search"
          placeholder="Search by hospital name or city..."
          autocomplete="off"
          aria-label="Search by hospital name or city"
        >

        <button
          type="button"
          id="clearSearch"
          class="clear-search"
          aria-label="Clear search"
          title="Clear search"
        >
          ×
        </button>
      </section>

      <!-- Hospital filters -->
      <section class="filter-row" aria-label="Hospital filters">
        <span class="filter-label">Sort / Filter:</span>

        <button
          type="button"
          class="filter-chip active"
          data-filter="all"
        >
          All Hospitals
        </button>

        <button
          type="button"
          class="filter-chip"
          data-filter="verified"
        >
          ✓ Verified
        </button>

        <button
          type="button"
          class="filter-chip"
          data-filter="lowfee"
        >
          ₹ Low Fee
        </button>
      </section>

      <!-- Quick search -->
      <section class="suggestions-section">
        <span class="section-kicker">Quick search</span>

        <div id="quickSearchChips" class="quick-chips">
          <button
            type="button"
            class="quick-chip"
            data-query="Hyderabad"
          >
            Hyderabad
          </button>

          <button
            type="button"
            class="quick-chip"
            data-query="Cardiology"
          >
            Cardiology
          </button>

          <button
            type="button"
            class="quick-chip"
            data-query="General Medicine"
          >
            General Medicine
          </button>

          <button
            type="button"
            class="quick-chip"
            data-query="Pediatrics"
          >
            Pediatrics
          </button>
        </div>
      </section>

      <!-- Recently viewed hospitals -->
      <section
        id="recentSection"
        class="hospital-section"
        hidden
      >
        <div class="section-heading">
          <h2>Recently Viewed</h2>
          <span class="section-note">Your recent hospitals</span>
        </div>

        <div
          id="recentHospitals"
          class="recent-grid"
        ></div>
      </section>

      <!-- Hospital listing -->
      <section class="hospital-section">

        <div class="section-heading">
          <h2>Popular Hospitals</h2>

          <span
            id="hospitalCount"
            class="section-note"
            aria-live="polite"
          >
            Loading hospitals...
          </span>
        </div>

        <!-- Hospital cards are inserted by script.js -->
        <div
          id="hospitalCards"
          class="hospital-list"
          aria-live="polite"
          aria-busy="true"
        >
          <div class="loading-card">
            <span class="spinner" aria-hidden="true"></span>
            <span>Loading hospitals from CarePath...</span>
          </div>
        </div>

        <!-- Empty or error message -->
        <p
          id="emptyHospitals"
          class="empty-state"
          role="status"
          hidden
        >
          No hospitals are currently available.
        </p>

      </section>

    </main>

    <!-- Footer -->
    <footer class="page-footer">
      <p>&copy; <span id="footerYear"></span> CarePath</p>
      <p>Find hospitals and book your token online.</p>
    </footer>

  </div>

  <script>
    // Display the current year.
    const footerYear = document.getElementById("footerYear");

    if (footerYear) {
      footerYear.textContent = new Date().getFullYear();
    }
  </script>

</body>
</html>
