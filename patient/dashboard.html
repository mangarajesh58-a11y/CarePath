<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="dashboard">

    <header>

        <div>

            <h1>🏥 HospitalCare</h1>

            <p>
                Book your hospital token
            </p>

        </div>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <div class="welcome">

        <h2>
            Welcome, <span id="patientName">
                Patient
            </span>
        </h2>

        <p>
            Select a hospital and doctor
            to get your token.
        </p>

    </div>


    <div class="booking-card">

        <h2>
            Book Hospital Token
        </h2>


        <label>
            Select Hospital
        </label>

        <select id="hospital">

            <option value="">
                Select Hospital
            </option>

            <option>
                City Care Hospital
            </option>

            <option>
                Life Hospital
            </option>

            <option>
                ABC Medical Center
            </option>

        </select>


        <label>
            Select Department
        </label>

        <select id="department">

            <option value="">
                Select Department
            </option>

            <option>
                General Medicine
            </option>

            <option>
                Cardiology
            </option>

            <option>
                Orthopedics
            </option>

            <option>
                Pediatrics
            </option>

            <option>
                Dermatology
            </option>

        </select>


        <label>
            Select Doctor
        </label>

        <select id="doctor">

            <option value="">
                Select Doctor
            </option>

            <option>
                Dr. Kumar
            </option>

            <option>
                Dr. Priya
            </option>

            <option>
                Dr. Ravi
            </option>

            <option>
                Dr. Anitha
            </option>

        </select>


        <div class="fee-box">

            <span>
                QueueLess Platform Fee
            </span>

            <strong>
                ₹10
            </strong>

        </div>


        <button
            class="book-button"
            onclick="bookToken()"
        >
            Continue & Get Token
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
