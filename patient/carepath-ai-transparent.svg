<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Chatbot Body Gradient -->
    <linearGradient id="botGradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glassmorphic Sheen -->
    <linearGradient id="sheenGradTrans" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Pulse & Heartbeat Wave Gradient -->
    <linearGradient id="pulseGradTrans" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="aiGlowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="botShadowTrans" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Top AI Neural Spark / Pulse Beacon -->
  <line x1="256" y1="124" x2="256" y2="92" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="84" r="14" fill="#22d3ee" filter="url(#aiGlowTrans)" />
  <circle cx="256" cy="84" r="6" fill="#ffffff" />

  <!-- Main AI Chatbot Bubble Body -->
  <g filter="url(#botShadowTrans)">
    <path d="M 160 120 
             L 352 120 
             A 64 64 0 0 1 416 184 
             L 416 312 
             A 64 64 0 0 1 352 376 
             L 242 376 
             L 174 416 
             A 10 10 0 0 1 158 406 
             L 160 376 
             A 64 64 0 0 1 96 312 
             L 96 184 
             A 64 64 0 0 1 160 120 Z" 
          fill="url(#botGradTrans)" 
          stroke="#7dd3fc" 
          stroke-width="3" 
          stroke-opacity="0.55" />
    
    <!-- Glossy Upper Sheen -->
    <path d="M 160 124 
             L 352 124 
             A 60 60 0 0 1 412 184 
             L 412 226 
             Q 256 268 100 226 
             L 100 184 
             A 60 60 0 0 1 160 124 Z" 
          fill="url(#sheenGradTrans)" />
  </g>

  <!-- Dark Visor Glass -->
  <rect x="144" y="168" width="224" height="92" rx="46" fill="#091427" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Friendly Glowing AI Eyes -->
  <g filter="url(#aiGlowTrans)">
    <rect x="188" y="192" width="24" height="44" rx="12" fill="#22d3ee" />
    <circle cx="194" cy="200" r="5" fill="#ffffff" />
  </g>
  <g filter="url(#aiGlowTrans)">
    <rect x="300" y="192" width="24" height="44" rx="12" fill="#22d3ee" />
    <circle cx="306" cy="200" r="5" fill="#ffffff" />
  </g>

  <!-- Center Medical Cross with Soft Glow -->
  <g filter="url(#aiGlowTrans)" opacity="0.95">
    <rect x="246" y="278" width="20" height="64" rx="7" fill="#ffffff" />
    <rect x="224" y="300" width="64" height="20" rx="7" fill="#ffffff" />
  </g>

  <!-- Dynamic ECG Heartbeat Pulse Line Overlay -->
  <path d="M 124 310 
           L 182 310 
           L 204 290 
           L 226 332 
           L 256 272 
           L 286 348 
           L 308 302 
           L 330 310 
           L 388 310" 
        fill="none" 
        stroke="url(#pulseGradTrans)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#aiGlowTrans)" />

  <!-- Heartbeat Endpoint Glowing Dots -->
  <circle cx="124" cy="310" r="5.5" fill="#22d3ee" filter="url(#aiGlowTrans)" />
  <circle cx="388" cy="310" r="5.5" fill="#4ade80" filter="url(#aiGlowTrans)" />

  <!-- Sparkle Stars for AI Intelligence -->
  <path d="M 416 102 Q 426 102 426 92 Q 426 102 436 102 Q 426 102 426 112 Q 426 102 416 102 Z" fill="#67e8f9" filter="url(#aiGlowTrans)" />
</svg>
