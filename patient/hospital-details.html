
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071329">
    <title>Hospital Details - CarePath</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        .details-container {
            max-width: 900px;
            margin: 24px auto;
            padding: 20px;
        }

        .hospital-detail-card {
            background: white;
            color: #172033;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
        }

        .hospital-detail-card h2 {
            margin-top: 0;
        }

        .detail-row {
            margin: 12px 0;
            line-height: 1.6;
        }

        .detail-label {
            font-weight: bold;
        }

        .back-button, .continue-button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            font-size: 15px;
        }

        .back-button {
            background: #e5e7eb;
            color: #111827;
        }

        .continue-button {
            background: #1765b1;
            color: white;
        }

        .hospital-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        #detailsMessage {
            margin-top: 16px;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">✚</span>
                <div>
                    <h1>CarePath</h1>
                    <p>Hospital Details</p>
                </div>
            </div>
            <button type="button" class="back-button"
                onclick="window.location.href='./index.html'">
                ← Back
            </button>
        </header>

        <main class="page-content details-container">
            <div id="hospitalDetails" class="hospital-detail-card">
                <p>Loading hospital details...</p>
            </div>

            <p id="detailsMessage" role="status"></p>
        </main>
    </div>

    <script>
        const hospitalContainer = document.getElementById("hospitalDetails");
        const message = document.getElementById("detailsMessage");

        function addDetail(container, label, value) {
            const row = document.createElement("p");
            row.className = "detail-row";

            const strong = document.createElement("span");
            strong.className = "detail-label";
            strong.textContent = label + ": ";

            const text = document.createElement("span");
            text.textContent = value || "Not provided";

            row.appendChild(strong);
            row.appendChild(text);
            container.appendChild(row);
        }

        function showHospitalDetails() {
            const savedHospital = localStorage.getItem("selectedHospital");

            if (!savedHospital) {
                hospitalContainer.replaceChildren();

                const heading = document.createElement("h2");
                heading.textContent = "No hospital selected";

                const paragraph = document.createElement("p");
                paragraph.textContent =
                    "Please return to the dashboard and select a hospital.";

                const button = document.createElement("button");
                button.className = "continue-button";
                button.textContent = "Choose Hospital";
                button.onclick = () => {
                    window.location.href = "./index.html";
                };

                hospitalContainer.append(heading, paragraph, button);
                return;
            }

            try {
                let hospital;

try {
    hospital = JSON.parse(savedHospital);
} catch (error) {
    hospital = { name: savedHospital };
}

if (typeof hospital === "string") {
    hospital = { name: hospital };
}
                hospitalContainer.replaceChildren();

                const heading = document.createElement("h2");
                heading.textContent =
                    hospital.name || hospital.hospital_name || "Hospital";

                hospitalContainer.appendChild(heading);

                const imageUrl =
                    hospital.cover_image_url ||
                    hospital.hospital_image_url ||
                    hospital.image_url ||
                    hospital.photo_url ||
                    hospital.hospital_photo ||
                    hospital.photo ||
                    hospital.image;

                if (imageUrl) {
                    const image = document.createElement("img");
                    image.className = "hospital-image";
                    image.src = imageUrl.startsWith("http")
    ? imageUrl
    : "https://carepath-3q9q.onrender.com/" + imageUrl.replace(/^\/+/, "");
                    image.alt = "Hospital building";
                    image.onerror = () => image.remove();
                    hospitalContainer.appendChild(image);
                }

                addDetail(
                    hospitalContainer,
                    "Hospital ID",
                    String(hospital.id ?? hospital.hospital_id ?? "")
                );

                addDetail(
                    hospitalContainer,
                    "Location",
                    hospital.city || hospital.address || hospital.location
                );

                addDetail(
                    hospitalContainer,
                    "Description",
                    hospital.description
                );

                addDetail(
                    hospitalContainer,
                    "Token Fee",
                    "₹" + Number(hospital.token_fee ?? hospital.tokenFee ?? 0)
                );

                addDetail(
                    hospitalContainer,
                    "Departments",
                    Array.isArray(hospital.departments)
                        ? hospital.departments.join(", ")
                        : hospital.departments
                );

                const button = document.createElement("button");
                button.type = "button";
                button.className = "continue-button";
                button.textContent = "View Departments & Doctors →";

                button.onclick = () => {
                    localStorage.setItem(
                        "hospital_id",
                        String(hospital.id ?? hospital.hospital_id)
                    );
                    localStorage.setItem(
                        "hospitalId",
                        String(hospital.id ?? hospital.hospital_id)
                    );

                    window.location.href = "./doctor.html";
                };

                hospitalContainer.appendChild(button);
            } catch (error) {
                console.error("Unable to display hospital details:", error);
                message.textContent =
                    "Unable to display hospital details. Please return to the dashboard and try again.";
            }
        }

        showHospitalDetails();
    </script>
</body>
</html>
