
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Registration - HospitalCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e3f2fd,
                    #ffffff
                );
        }

        .auth-container {
            width: 400px;
        }

        .logo {
            text-align: center;

            font-size: 48px;
        }

        .auth-container h1 {
            text-align: center;

            color: #1565c0;

            margin: 8px 0;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 20px;
        }

        .form-card {
            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        .form-card label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        .form-card input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            box-sizing: border-box;
        }

        .form-card button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1976d2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .form-card button:hover {
            background: #125ca8;
        }

        .register-text {
            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .register-text a {
            color: #1976d2;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="logo">
        🏥
    </div>


    <h1>
        HospitalCare
    </h1>


    <p class="subtitle">
        Create Patient Account
    </p>


    <div class="form-card">


        <!-- FULL NAME -->

        <label>
            Full Name
        </label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
        >


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter email"
        >


        <!-- PHONE -->

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
        >


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create password"
        >


        <!-- CONFIRM PASSWORD -->

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >


        <!-- REGISTER -->

        <button
            type="button"
            onclick="registerPatient()"
        >
            Register
        </button>


        <p class="register-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>


    </div>


</div>


<script src="script.js"></script>


</body>

</html>
