<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePath - Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #dbeafe, #eef2ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon-badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 18px auto;
        }

        .header h2 {
            font-size: 26px;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .message-box.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message-box.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .step-section {
            transition: all 0.3s ease;
        }

        .hidden {
            display: none;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .badge-step {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon-badge">🔒</div>
            <span class="badge-step" id="stepBadge">Step 1 of 2</span>
            <h2 id="pageTitle">Forgot Password</h2>
            <p id="pageSubtitle">Enter your registered email address and we'll send you a 6-digit verification code to reset your password.</p>
        </div>

        <div id="messageBox" class="message-box"></div>

        <!-- STEP 1: REQUEST OTP -->
        <form id="step1Form" onsubmit="handleRequestOtp(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. name@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn" id="btnRequestOtp">
                <span>Send Verification Code</span>
            </button>
        </form>

        <!-- STEP 2: VERIFY & RESET PASSWORD -->
        <form id="step2Form" class="hidden" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="displayEmail">Email</label>
                <input type="text" id="displayEmail" disabled style="background:#f3f4f6; color:#6b7280;">
            </div>

            <div class="form-group">
                <label for="otp">6-Digit Verification Code</label>
                <input type="text" id="otp" placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}" required inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your new password" minlength="6" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn" id="btnResetPassword">
                <span>Reset Password</span>
            </button>
        </form>

        <div class="footer-links">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const API = "https://carepath-3q9q.onrender.com";

        const messageBox = document.getElementById("messageBox");
        const step1Form = document.getElementById("step1Form");
        const step2Form = document.getElementById("step2Form");
        const stepBadge = document.getElementById("stepBadge");
        const pageTitle = document.getElementById("pageTitle");
        const pageSubtitle = document.getElementById("pageSubtitle");
        const btnRequestOtp = document.getElementById("btnRequestOtp");
        const btnResetPassword = document.getElementById("btnResetPassword");

        let userEmail = "";

        function showMessage(text, type = "error") {
            messageBox.className = `message-box ${type}`;
            messageBox.textContent = text;
        }

        function clearMessage() {
            messageBox.className = "message-box";
            messageBox.textContent = "";
        }

        async function handleRequestOtp(event) {
            event.preventDefault();
            clearMessage();

            const emailInput = document.getElementById("email");
            userEmail = emailInput.value.trim().toLowerCase();

            if (!userEmail || !userEmail.includes("@")) {
                showMessage("Please enter a valid email address.", "error");
                return;
            }

            btnRequestOtp.disabled = true;
            btnRequestOtp.innerHTML = "<span>Sending code...</span>";

            try {
                const response = await fetch(`${API}/auth/forgot-password/request-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: userEmail,
                        role: "patient"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Unable to send verification code. Please check your email.");
                }

                // Transition to Step 2
                step1Form.classList.add("hidden");
                step2Form.classList.remove("hidden");
                document.getElementById("displayEmail").value = userEmail;

                stepBadge.textContent = "Step 2 of 2";
                pageTitle.textContent = "Create New Password";
                pageSubtitle.textContent = `Enter the 6-digit code sent to ${userEmail} and set your new password.`;

                showMessage(data.message || "Verification code sent to your email!", "success");
            } catch (err) {
                showMessage(err.message, "error");
            } finally {
                btnRequestOtp.disabled = false;
                btnRequestOtp.innerHTML = "<span>Send Verification Code</span>";
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            clearMessage();

            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (otp.length !== 6 || !/^\d+$/.test(otp)) {
                showMessage("Please enter a valid 6-digit OTP code.", "error");
                return;
            }

            if (newPassword.length < 6) {
                showMessage("Password must be at least 6 characters long.", "error");
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match. Please verify and re-enter.", "error");
                return;
            }

            btnResetPassword.disabled = true;
            btnResetPassword.innerHTML = "<span>Resetting password...</span>";

            try {
                const response = await fetch(`${API}/auth/forgot-password/reset`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: userEmail,
                        role: "patient",
                        otp: otp,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Password reset failed. Please check your code.");
                }

                showMessage("✅ Password reset successful! Redirecting to login...", "success");
                btnResetPassword.style.display = "none";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2200);
            } catch (err) {
                showMessage(err.message, "error");
                btnResetPassword.disabled = false;
                btnResetPassword.innerHTML = "<span>Reset Password</span>";
            }
        }
    </script>
</body>

</html>
