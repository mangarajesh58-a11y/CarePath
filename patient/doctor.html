<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - CarePath</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            color: #1e293b;
        }

        /* ================================
           HEADER
        ================================= */
        .header {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.2);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .back-button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #eff6ff;
            transform: translateY(-1px);
        }

        /* ================================
           CONTAINER
        ================================= */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px 40px;
        }

        .title {
            margin-bottom: 22px;
        }

        .title h2 {
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .title p {
            color: #475569;
            font-size: 15px;
            font-weight: 600;
        }

        /* ================================
           DOCTOR GRID
        ================================= */
        #doctorList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ================================
           DOCTOR CARD
        ================================= */
        .doctor-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .doctor-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
        }

        .doctor-card h3 {
            color: #1d4ed8;
            font-size: 19px;
            margin-bottom: 12px;
            text-align: center;
        }

        .detail {
            margin: 8px 0;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.45;
        }

        .detail strong {
            color: #1e293b;
        }

        .token-button {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s;
        }

        .token-button:hover:not(:disabled) {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* ================================
           SKELETON SHIMMER (INSTANT UX)
        ================================= */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-box {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            margin: 0 auto 6px;
        }

        .skeleton-line {
            height: 14px;
        }

        .skeleton-btn {
            height: 44px;
            margin-top: 8px;
            border-radius: 8px;
        }

        /* ================================
           EMPTY & ERROR
        ================================= */
        .empty {
            background: white;
            padding: 35px 20px;
            text-align: center;
            border-radius: 12px;
            color: #64748b;
            grid-column: 1 / -1;
            border: 1px solid #e2e8f0;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 20px;
            border-radius: 10px;
            grid-column: 1 / -1;
            text-align: center;
            border: 1px solid #fecaca;
        }

        /* ================================
           MOBILE
        ================================= */
        @media (max-width: 600px) {
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .back-button {
                width: 100%;
                text-align: center;
            }

            .container {
                margin: 18px auto;
                padding: 0 14px 30px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div>
            <h1>🏥 CarePath</h1>
            <p>Available OPD Doctors</p>
        </div>
        <button type="button" class="back-button" id="backButton">
            ← Back to Dashboard
        </button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <div class="title">
            <h2>Find Your Doctor</h2>
            <p id="hospitalName">
                🏥 Loading hospital...
            </p>
        </div>

        <!-- Department Filter -->
        <div style="margin-bottom: 22px;">
            <label for="departmentSelect" style="display:block; margin-bottom:8px; font-weight:700; color: #1e293b; font-size: 14px;">
                Filter by Department:
            </label>
            <select
                id="departmentSelect"
                style="
                    width: 100%;
                    max-width: 420px;
                    padding: 12px 14px;
                    border: 1px solid #cbd5e1;
                    border-radius: 8px;
                    font-size: 15px;
                    background: white;
                    color: #0f172a;
                    font-weight: 500;
                    cursor: pointer;
                "
            >
                <option value="">All Departments (Show All Doctors)</option>
            </select>
        </div>

        <!-- Doctor List Grid -->
        <div id="doctorList">
            <!-- Populated via instant cache or skeleton shimmer -->
        </div>
    </main>

    <script>
        const API = "https://carepath-3q9q.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        const urlHospId = urlParams.get("id") || urlParams.get("hospital_id") || urlParams.get("hospitalId");
        if (urlHospId) {
            localStorage.setItem("hospital_id", urlHospId);
            localStorage.setItem("hospitalId", urlHospId);
            localStorage.setItem("selectedHospitalId", urlHospId);
        }
        let hospitalId =
            urlHospId ||
            localStorage.getItem("hospital_id") ||
            localStorage.getItem("hospitalId") ||
            localStorage.getItem("selectedHospitalId");

        const doctorList = document.getElementById("doctorList");
        const departmentSelect = document.getElementById("departmentSelect");
        const hospitalNameElement = document.getElementById("hospitalName");
        const backButton = document.getElementById("backButton");

        let allDoctors = [];

        // 1. INSTANT HOSPITAL NAME FROM LOCALSTORAGE (0ms)
        const savedHospName = localStorage.getItem("selectedHospitalName") || "";
        if (savedHospName) {
            hospitalNameElement.textContent = "🏥 " + savedHospName;
        }

        // 2. TIME FORMATTERS
        function formatTime12Hour(timeStr) {
            if (!timeStr || typeof timeStr !== "string" || !timeStr.includes(":")) return timeStr || "";
            const parts = timeStr.trim().split(":");
            let hours = parseInt(parts[0], 10);
            const minutes = parts[1].slice(0, 2);
            if (isNaN(hours)) return timeStr;
            const period = hours >= 12 ? "PM" : "AM";
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${period}`;
        }

        function formatConsultationHours(start, end) {
            if (!start || !end) return "Not specified";
            return `${formatTime12Hour(start)} - ${formatTime12Hour(end)}`;
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        // 3. SKELETON SHIMMER LOADER (Immediate visual feedback)
        function renderSkeletons() {
            doctorList.innerHTML = [1, 2, 3].map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-box skeleton-avatar"></div>
                    <div class="skeleton-box skeleton-line" style="width: 60%; height: 20px; margin: 0 auto 12px;"></div>
                    <div class="skeleton-box skeleton-line" style="width: 80%;"></div>
                    <div class="skeleton-box skeleton-line" style="width: 70%;"></div>
                    <div class="skeleton-box skeleton-line" style="width: 85%;"></div>
                    <div class="skeleton-box skeleton-line" style="width: 50%;"></div>
                    <div class="skeleton-box skeleton-btn"></div>
                </div>
            `).join("");
        }

        // 4. INSTANT CACHE HYDRATION (Stale-While-Revalidate - 0ms!)
        function tryLoadFromCache() {
            if (!hospitalId) return false;
            try {
                const raw = localStorage.getItem("cached_doctors_" + hospitalId);
                if (raw) {
                    const cached = JSON.parse(raw);
                    if (Array.isArray(cached) && cached.length > 0) {
                        allDoctors = cached;
                        populateDepartments(cached);
                        renderDoctorCards(cached);
                        return true;
                    }
                }
            } catch (e) {
                console.warn("Cache read error:", e);
            }
            return false;
        }

        // 5. POPULATE DEPARTMENTS (Defaults to Show All Doctors)
        function populateDepartments(doctors) {
            const currentVal = departmentSelect.value;
            const departments = [
                ...new Set(
                    doctors
                        .map(d => (d.department || "").trim())
                        .filter(d => d !== "")
                )
            ].sort();

            departmentSelect.innerHTML = '<option value="">All Departments (Show All Doctors)</option>';
            departments.forEach(dept => {
                const opt = document.createElement("option");
                opt.value = dept;
                opt.textContent = dept;
                departmentSelect.appendChild(opt);
            });

            if (currentVal && departments.includes(currentVal)) {
                departmentSelect.value = currentVal;
            }
        }

        // 6. RENDER DOCTOR CARDS (Immediately visible without forcing dropdown click!)
        function renderDoctorCards(doctorsToRender) {
            const selectedDept = (departmentSelect.value || "").trim();
            const filtered = selectedDept
                ? doctorsToRender.filter(d => (d.department || "").trim() === selectedDept)
                : doctorsToRender;

            if (!filtered || filtered.length === 0) {
                doctorList.innerHTML = `
                    <div class="empty">
                        <div style="font-size:36px;margin-bottom:8px;">🩺</div>
                        <h3 style="color:#0f172a;margin-bottom:6px;">No Doctors Found</h3>
                        <p style="font-size:14px;color:#64748b;">No available doctors in the selected department. Please choose another department or view all.</p>
                    </div>
                `;
                return;
            }

            doctorList.innerHTML = "";

            filtered.forEach(doctor => {
                const card = document.createElement("div");
                card.className = "doctor-card";

                const avatarContainer = document.createElement("div");
                avatarContainer.className = "doctor-avatar-container";
                avatarContainer.style.cssText = "width: 82px; height: 82px; border-radius: 50%; overflow: hidden; margin: 0 auto 16px; border: 3px solid #0284c7; background: #e0f2fe; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); flex-shrink: 0;";

                if (doctor.image_url) {
                    const pUrl = doctor.image_url.startsWith("http")
                        ? doctor.image_url
                        : `${API}${doctor.image_url.startsWith("/") ? "" : "/"}${doctor.image_url}`;
                    const img = document.createElement("img");
                    img.src = pUrl;
                    img.alt = doctor.name || "Doctor";
                    img.style.cssText = "width: 100%; height: 100%; object-fit: cover; display: block;";
                    img.onerror = function() {
                        img.style.display = "none";
                        avatarContainer.innerHTML = '<span style="font-size: 38px;">👨‍⚕️</span>';
                    };
                    avatarContainer.appendChild(img);
                } else {
                    avatarContainer.innerHTML = '<span style="font-size: 38px;">👨‍⚕️</span>';
                }

                const name = document.createElement("h3");
                name.textContent = doctor.name || "Doctor";

                const department = document.createElement("div");
                department.className = "detail";
                department.innerHTML = `<strong>Department:</strong> ${escapeHtml(doctor.department || "General Medicine")}`;

                const specialization = document.createElement("div");
                specialization.className = "detail";
                specialization.innerHTML = `<strong>Specialization:</strong> ${escapeHtml(doctor.specialization || "General Physician")}`;

                const experience = document.createElement("div");
                experience.className = "detail";
                experience.innerHTML = `<strong>Experience:</strong> ${escapeHtml(doctor.experience || "Verified OPD Practitioner")}`;

                const availableDays = document.createElement("div");
                availableDays.className = "detail";
                availableDays.innerHTML = `<strong>Available Days:</strong> ${escapeHtml(doctor.available_days || "Mon - Sat")}`;

                const consultationHours = document.createElement("div");
                consultationHours.className = "detail";
                consultationHours.innerHTML = `<strong>Consultation Hours:</strong> ${escapeHtml(doctor.consultation_hours_12h || formatConsultationHours(doctor.start_time, doctor.end_time))}`;

                const doctorRoom = document.createElement("div");
                doctorRoom.className = "detail";
                doctorRoom.innerHTML = `<strong>Consultation Room:</strong> 🚪 ${escapeHtml(doctor.room_number || "Assigned upon arrival")}`;

                const doctorStatus = document.createElement("div");
                doctorStatus.className = "detail";
                const isAvailable = doctor.is_available !== false;
                doctorStatus.innerHTML = `<strong>Today's Status:</strong> <span style="font-weight:700; color:${isAvailable ? "#15803d" : "#b91c1c"};">${isAvailable ? "🟢 On Duty (Available)" : "🔴 Off Duty (Unavailable)"}</span>`;

                const button = document.createElement("button");
                button.type = "button";
                button.className = "token-button";
                button.textContent = isAvailable ? "🎟️ Select Doctor & Book Token" : "Doctor Unavailable Today";
                button.disabled = !isAvailable;

                if (!isAvailable) {
                    button.style.background = "#94a3b8";
                    button.style.cursor = "not-allowed";
                } else {
                    button.addEventListener("click", () => selectDoctor(doctor));
                }

                card.appendChild(avatarContainer);
                card.appendChild(name);
                card.appendChild(department);
                card.appendChild(specialization);
                card.appendChild(experience);
                card.appendChild(availableDays);
                card.appendChild(consultationHours);
                card.appendChild(doctorRoom);
                card.appendChild(doctorStatus);
                card.appendChild(button);

                doctorList.appendChild(card);
            });
        }

        // 7. MISSING HOSPITAL FALLBACK (If opened directly without params)
        async function handleMissingHospital() {
            hospitalNameElement.textContent = "Please select a hospital";
            doctorList.innerHTML = `
                <div class="empty">
                    <div style="font-size: 38px; margin-bottom: 12px;">🏥</div>
                    <h3 style="color: #0f172a; margin-bottom: 8px;">Select a Hospital First</h3>
                    <p style="margin-bottom: 20px; font-size: 14px;">Please choose a hospital to view its available OPD doctors and book tokens.</p>
                    <div style="margin-bottom: 20px;">
                        <select id="directHospitalPicker" style="padding: 12px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; width: 100%; max-width: 400px; background: white; color: #0f172a;">
                            <option value="">-- Select a Hospital --</option>
                        </select>
                    </div>
                    <button onclick="window.location.href='dashboard.html'" style="background: #2563eb; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                        ← Browse Hospitals on Dashboard
                    </button>
                </div>
            `;

            try {
                const res = await fetch(`${API}/hospitals`);
                if (res.ok) {
                    const hospitals = await res.json();
                    const picker = document.getElementById("directHospitalPicker");
                    if (picker && Array.isArray(hospitals)) {
                        picker.innerHTML = '<option value="">-- Select a Hospital --</option>' +
                            hospitals.map(h => `<option value="${h.id}">${escapeHtml(h.name)} (${escapeHtml(h.city || 'Odisha')})</option>`).join("");
                        picker.addEventListener("change", function() {
                            if (this.value) {
                                hospitalId = this.value;
                                localStorage.setItem("hospital_id", hospitalId);
                                localStorage.setItem("hospitalId", hospitalId);
                                localStorage.setItem("selectedHospitalId", hospitalId);
                                const sel = hospitals.find(h => String(h.id) === String(hospitalId));
                                if (sel) {
                                    localStorage.setItem("selectedHospitalName", sel.name || "");
                                    hospitalNameElement.textContent = "🏥 " + sel.name;
                                }
                                loadData();
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("Could not fetch hospital list:", e);
            }
        }

        // 8. PARALLEL HIGH-SPEED DATA FETCH
        async function loadData() {
            if (!hospitalId) {
                handleMissingHospital();
                return;
            }

            const hasCache = tryLoadFromCache();
            if (!hasCache) {
                renderSkeletons();
            }

            try {
                // Fetch hospital details and doctors in parallel
                const [hospRes, docRes] = await Promise.all([
                    fetch(`${API}/hospitals/${hospitalId}`).catch(e => ({ ok: false, error: e })),
                    fetch(`${API}/hospitals/${hospitalId}/doctors`).catch(e => ({ ok: false, error: e }))
                ]);

                if (hospRes && hospRes.ok) {
                    const hospital = await hospRes.json();
                    hospitalNameElement.textContent = "🏥 " + (hospital.name || "Hospital");
                    localStorage.setItem("selectedHospitalName", hospital.name || "");
                    localStorage.setItem("selectedHospitalTokenFee", Number(hospital.token_fee || 0));
                }

                if (docRes && docRes.ok) {
                    const doctors = await docRes.json();
                    allDoctors = Array.isArray(doctors) ? doctors : [];
                    localStorage.setItem("cached_doctors_" + hospitalId, JSON.stringify(allDoctors));
                    populateDepartments(allDoctors);
                    renderDoctorCards(allDoctors);
                } else if (!hasCache) {
                    doctorList.innerHTML = `
                        <div class="empty">
                            <div style="font-size:36px;margin-bottom:8px;">👨‍⚕️</div>
                            <h3 style="color:#0f172a;margin-bottom:6px;">No Doctors Available</h3>
                            <p style="font-size:14px;color:#64748b;">This hospital has not listed any doctors yet.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Load error:", err);
                if (!hasCache) {
                    doctorList.innerHTML = `
                        <div class="error">
                            ❌ Server is taking longer to respond.
                            <br><br>
                            <button onclick="loadData()" style="background:#b91c1c;color:white;border:none;padding:8px 18px;border-radius:6px;font-weight:bold;cursor:pointer;">
                                🔄 Retry Loading
                            </button>
                        </div>
                    `;
                }
            }
        }

        // 9. SELECT DOCTOR
        function selectDoctor(doctor) {
            localStorage.setItem("selectedDoctor", doctor.name || "");
            localStorage.setItem("selectedDoctorPhoto", doctor.image_url || "");
            localStorage.setItem("selectedDoctorHours", doctor.consultation_hours_12h || formatConsultationHours(doctor.start_time, doctor.end_time));
            localStorage.setItem("selectedDoctorRoomNumber", doctor.room_number || "");
            localStorage.setItem("selectedDoctorId", doctor.id || "");
            localStorage.setItem("selectedDepartment", doctor.department || "");
            localStorage.setItem("selectedDoctorSpecialization", doctor.specialization || "");

            window.location.href = "token.html";
        }

        // 10. EVENT LISTENERS & BOOTSTRAP
        departmentSelect.addEventListener("change", () => renderDoctorCards(allDoctors));

        backButton.addEventListener("click", () => {
            window.location.href = "dashboard.html";
        });

        // Start high-speed load
        loadData();
    </script>
</body>
</html>
