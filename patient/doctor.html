<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctors - CarePath</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }


        /* ================================
           HEADER
        ================================= */

        .header {

            background: #2563eb;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .header h1 {
            margin-bottom: 5px;
        }


        .header p {
            opacity: 0.9;
        }


        .back-button {

            background: white;

            color: #2563eb;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }


        .back-button:hover {
            background: #eff6ff;
        }



        /* ================================
           CONTAINER
        ================================= */

        .container {

            max-width: 1000px;

            margin: 35px auto;

            padding: 20px;

        }


        .title {
            margin-bottom: 25px;
        }


        .title h2 {

            color: #111827;

            margin-bottom: 8px;

        }


        .title p {
            color: #6b7280;
        }



        /* ================================
           DOCTOR GRID
        ================================= */

        #doctorList {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;

        }



        /* ================================
           DOCTOR CARD
        ================================= */

        .doctor-card {

            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

        }


        .doctor-icon {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .doctor-card h3 {

            color: #1d4ed8;

            margin-bottom: 15px;

        }


        .detail {

            margin: 10px 0;

            color: #4b5563;

            line-height: 1.5;

        }


        .token-button {

            width: 100%;

            margin-top: 18px;

            padding: 12px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }


        .token-button:hover {

            background: #1d4ed8;

        }



        /* ================================
           EMPTY
        ================================= */

        .empty {

            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 12px;

            color: #6b7280;

            grid-column: 1 / -1;

        }



        /* ================================
           ERROR
        ================================= */

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 15px;

            border-radius: 8px;

            grid-column: 1 / -1;

        }



        /* ================================
           LOADING
        ================================= */

        .loading {

            text-align: center;

            color: #6b7280;

            grid-column: 1 / -1;

            padding: 30px;

        }



        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .header {

                padding: 15px;

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .back-button {

                width: 100%;

            }


            .container {

                margin: 20px auto;

                padding: 15px;

            }

        }

    </style>

</head>



<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">


        <div>

            <h1>
                🏥 CarePath
            </h1>

            <p>
                Available Doctors
            </p>

        </div>


        <button
            type="button"
            class="back-button"
            id="backButton"
        >

            ← Back

        </button>


    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="container">
<div class="title">

    <h2>Find Your Doctor</h2>

    <p id="hospitalName">
        Loading hospital...
    </p>

</div>

<!-- Department Selection -->
<div style="margin-bottom: 25px;">

    <label
        for="departmentSelect"
        style="display:block; margin-bottom:10px; font-weight:bold;"
    >
        Select Department
    </label>

    <select
        id="departmentSelect"
        style="
            width:100%;
            max-width:450px;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:16px;
            background:white;
        "
    >
        <option value="">Loading departments...</option>
    </select>


</div>

<!-- Doctor List -->
<div id="doctorList">
    <div class="loading">
        Select a department to view available doctors.
    </div>
</div>

</main>


    <script>

        const API =
            "http://127.0.0.1:8000";


        /* =========================================
           GET HOSPITAL ID
        ========================================== */

        const hospitalId =
            localStorage.getItem("hospital_id") ||
            localStorage.getItem("hospitalId");


        /* =========================================
           ELEMENTS
        ========================================== */

        const doctorList =
            document.getElementById("doctorList");

            const departmentSelect =
    document.getElementById("departmentSelect");

let allDoctors = [];


        const hospitalNameElement =
            document.getElementById("hospitalName");


        const backButton =
            document.getElementById("backButton");



        /* =========================================
           LOAD HOSPITAL
        ========================================== */

        async function loadHospital() {

            if (!hospitalId) {

                hospitalNameElement.textContent =
                    "No hospital selected.";

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API}/hospitals/${hospitalId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load hospital."
                    );

                }


                const hospital =
                    await response.json();


                hospitalNameElement.textContent =
                    hospital.name ||
                    "Hospital";


                /*
                 * Save the latest hospital data.
                 */

                localStorage.setItem(
                    "hospital_id",
                    hospital.id
                );


                localStorage.setItem(
                    "hospitalId",
                    hospital.id
                );


                localStorage.setItem(
                    "selectedHospitalId",
                    hospital.id
                );


                localStorage.setItem(
                    "selectedHospitalName",
                    hospital.name || ""
                );


                /*
                 * Save hospital token fee.
                 */

                localStorage.setItem(
                    "selectedHospitalTokenFee",
                    Number(hospital.token_fee || 0)
                );


            } catch (error) {

                console.error(
                    "Hospital loading error:",
                    error
                );

                hospitalNameElement.textContent =
                    "Hospital information unavailable.";

            }

        }



        /* =========================================
           LOAD DOCTORS
        ========================================== */

        async function loadDoctors() {


            if (!hospitalId) {

                doctorList.innerHTML = `

                    <div class="error">

                        ❌ Hospital not selected.

                        <br><br>

                        Please go back and
                        select a hospital.

                    </div>

                `;

                return;

            }


            try {


                const response =
                    await fetch(
                        `${API}/hospitals/${hospitalId}/doctors`
                    );


                if (!response.ok) {

                    let message =
                        "Could not load doctors.";


                    try {

                        const errorData =
                            await response.json();


                        if (errorData.detail) {

                            message =
                                errorData.detail;

                        }

                    } catch {

                        // Keep default message

                    }


                    throw new Error(message);

                }


                allDoctors = await response.json();

if (!Array.isArray(allDoctors)) {
    allDoctors = [];
}

// Keep the currently selected department
const previousDepartment = departmentSelect.value;

// Get unique departments from this hospital's doctors
const departments = [
    ...new Set(
        allDoctors
            .map(doctor => (doctor.department || "").trim())
            .filter(department => department !== "")
    )
].sort();

departmentSelect.innerHTML =
    '<option value="">Select a department</option>';

departments.forEach(department => {
    const option = document.createElement("option");
    option.value = department;
    option.textContent = department;
    departmentSelect.appendChild(option);
});

// Restore previous selection when refreshing
if (departments.includes(previousDepartment)) {
    departmentSelect.value = previousDepartment;
}

                if (allDoctors.length === 0) {

                    doctorList.innerHTML = `

                        <div class="empty">

                            <h3>
                                No Doctors Available
                            </h3>

                            <br>

                            <p>

                                This hospital has not
                                added any doctors yet.

                            </p>

                        </div>

                    `;

                    return;

                }


                doctorList.innerHTML = "";

const selectedDepartment = departmentSelect.value;

// Ask the patient to select a department first
if (!selectedDepartment) {
    doctorList.innerHTML = `
        <div class="empty">
            <h3>Select a Department</h3>
            <br>
            <p>
                Please choose a department above
                to view its available doctors.
            </p>
        </div>
    `;
    return;
}

// Display doctors only from the selected department
const filteredDoctors = allDoctors.filter(doctor =>
    (doctor.department || "").trim() === selectedDepartment
);
               

if (filteredDoctors.length === 0) {
    doctorList.innerHTML = `
        <div class="empty">
            <h3>No Doctors in This Department</h3>
            <br>
            <p>Please select another department.</p>
        </div>
    `;
    return;
}

filteredDoctors.forEach(
    doctor => {


                        const card =
                            document.createElement("div");


                        card.className =
                            "doctor-card";


                        const icon =
                            document.createElement("div");


                        icon.className =
                            "doctor-icon";


                        icon.textContent =
                            "👨‍⚕️";


                        const name =
                            document.createElement("h3");


                        name.textContent =
                            doctor.name ||
                            "Doctor";


                        const department =
                            document.createElement("div");


                        department.className =
                            "detail";


                        department.innerHTML =
                            "<strong>Department:</strong> ";


                        const departmentText =
                            document.createTextNode(
                                doctor.department ||
                                "Not specified"
                            );


                        department.appendChild(
                            departmentText
                        );


                        const specialization =
                            document.createElement("div");


                        specialization.className =
                            "detail";


                        specialization.innerHTML =
                            "<strong>Specialization:</strong> ";


                        const specializationText =
                            document.createTextNode(
                                doctor.specialization ||
                                "Not specified"
                            );


                        specialization.appendChild(
                            specializationText
                        );


                        const experience =
                            document.createElement("div");


                        experience.className =
                            "detail";


                        experience.innerHTML =
                            "<strong>Experience:</strong> ";


                        const experienceText =
                            document.createTextNode(
                                doctor.experience ||
                                "Not specified"
                            );


                        experience.appendChild(
                            experienceText
                        );

// Doctor available weekdays
const availableDays = document.createElement("div");
availableDays.className = "detail";

availableDays.innerHTML = "<strong>Available Days:</strong> ";

availableDays.appendChild(
    document.createTextNode(
        doctor.available_days || "Not specified"
    )
);

// Consultation hours
const consultationHours = document.createElement("div");
consultationHours.className = "detail";

consultationHours.innerHTML = "<strong>Consultation Hours:</strong> ";

consultationHours.appendChild(
    document.createTextNode(
        doctor.start_time && doctor.end_time
            ? `${doctor.start_time} - ${doctor.end_time}`
            : "Not specified"
    )
);

// Doctor status
const doctorStatus = document.createElement("div");
doctorStatus.className = "detail";

const isAvailable = doctor.is_available !== false;

doctorStatus.innerHTML = "<strong>Status:</strong> ";

doctorStatus.appendChild(
    document.createTextNode(
        isAvailable ? "Available" : "Unavailable"
    )
);

doctorStatus.style.color = isAvailable ? "green" : "red";
                        const button =
                            document.createElement("button");


                        button.type =
                            "button";


                        button.className =
                            "token-button";


                        const isDoctorAvailable = doctor.is_available !== false;

button.textContent = isDoctorAvailable
    ? "🎟️ Select Doctor"
    : "Doctor Unavailable";

button.disabled = !isDoctorAvailable;

if (!isDoctorAvailable) {
    button.style.background = "#9ca3af";
    button.style.cursor = "not-allowed";
}


                        button.addEventListener(
                            "click",
                            function () {

                                selectDoctor(
                                    doctor
                                );

                            }
                        );

                        card.appendChild(icon);
                        card.appendChild(name);
                        card.appendChild(department);
card.appendChild(specialization);
card.appendChild(experience);
card.appendChild(availableDays);
card.appendChild(consultationHours);
card.appendChild(doctorStatus);
                        card.appendChild(button);

                        doctorList.appendChild(card);

                    });

                } catch (error) {

                console.error(
                    "Doctor loading error:",
                    error
                );


                doctorList.innerHTML = `

                    <div class="error">

                        ❌ Cannot load doctors.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;

            }

        }



        /* =========================================
           SELECT DOCTOR
        ========================================== */

        function selectDoctor(doctor) {


            /*
             * Store doctor information.
             */

            localStorage.setItem(
                "selectedDoctor",
                doctor.name || ""
            );


            localStorage.setItem(
                "selectedDoctorId",
                doctor.id || ""
            );


            localStorage.setItem(
                "selectedDepartment",
                doctor.department || ""
            );


            localStorage.setItem(
                "selectedDoctorSpecialization",
                doctor.specialization || ""
            );


            /*
             * Go to token/payment page.
             */

            window.location.href =
                "token.html";

        }



        /* =========================================
           BACK
        ========================================== */

        backButton.addEventListener(
            "click",
            function () {

                /*
                 * Return to patient dashboard.
                 */

                window.location.href =
                    "dashboard.html";

            }
        );



        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(value) {

            const div =
                document.createElement("div");


            div.textContent =
                value ?? "";


            return div.innerHTML;

        }



        /* =========================================
           START
        ========================================== */
            departmentSelect.addEventListener("change", loadDoctors);

loadHospital();

loadDoctors();
        
    </script>


</body>

</html>
